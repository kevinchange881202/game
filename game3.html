<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08061a">
<title>星际英语探险 · 陈思宇专供版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#08061a;color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
user-select:none;-webkit-user-select:none;position:fixed;top:0;left:0;right:0;bottom:0;
overscroll-behavior:none;touch-action:manipulation}
#bgCanvas{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0}
#fxCanvas{position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;pointer-events:none}
#app{position:fixed;top:0;left:0;right:0;bottom:0;z-index:1}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;overflow-y:auto;
-webkit-overflow-scrolling:touch;
padding:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-right,0px) + 22px)
calc(env(safe-area-inset-bottom,0px) + 20px) calc(env(safe-area-inset-left,0px) + 22px)}
.screen.active{display:flex}

/* 金币图标：CSS 绘制，兼容所有 iPad */
.coin-icon{display:inline-block;width:1.2em;height:1.2em;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#fef3c7,#fbbf24 50%,#d97706 100%);
  border:0.12em solid #92400e;position:relative;vertical-align:-0.15em;margin:0 0.1em;
  box-shadow:inset 0 0.15em 0.3em rgba(255,255,255,.85),inset 0 -0.15em 0.25em rgba(0,0,0,.35),
  0 0.1em 0.25em rgba(0,0,0,.5)}
.coin-icon::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:0.45em;height:0.45em;border-radius:50%;
  background:radial-gradient(circle,#fef9c3,#f59e0b);border:0.05em solid #92400e}

/* 通用按钮 */
.btn{border:none;border-radius:26px;font-family:inherit;font-weight:900;color:#fff;cursor:pointer;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .25s;position:relative;
  overflow:hidden;letter-spacing:.8px;isolation:isolate}
.btn::before{content:'';position:absolute;top:-50%;left:-60%;width:60%;height:200%;
  background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.6) 50%,transparent 80%);
  transform:skewX(-20deg);animation:shine 3.5s ease-in-out infinite;z-index:1;pointer-events:none}
@keyframes shine{0%,60%{left:-60%}100%{left:140%}}
.btn:active{transform:scale(.94)}
.btn-primary{background:linear-gradient(135deg,#6366f1 0%,#a855f7 50%,#ec4899 100%);
  padding:28px 40px;font-size:32px;min-height:90px;
  box-shadow:0 16px 56px rgba(168,85,247,.7),0 6px 18px rgba(0,0,0,.5),
  inset 0 3px 0 rgba(255,255,255,.45),inset 0 -6px 16px rgba(0,0,0,.25);
  text-shadow:0 3px 10px rgba(0,0,0,.5)}
.btn-ghost{background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
  border:2px solid rgba(255,255,255,.28);padding:20px 30px;font-size:23px;min-height:72px;
  backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 20px rgba(0,0,0,.35);
  text-shadow:0 2px 6px rgba(0,0,0,.5)}
.icon-btn{background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.07));
  border:2px solid rgba(255,255,255,.25);border-radius:22px;color:#fff;font-size:30px;
  width:72px;height:72px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform .15s;backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 18px rgba(0,0,0,.4);font-weight:900}
.icon-btn:active{transform:scale(.86)}

/* 首页 */
#s-home{align-items:center;justify-content:center;text-align:center;position:relative}
.home-orbit{position:absolute;top:50%;left:50%;width:min(110vmin,600px);height:min(110vmin,600px);
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,rgba(168,85,247,.25),transparent 65%);
  animation:orbitPulse 4s ease-in-out infinite}
@keyframes orbitPulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.9}50%{transform:translate(-50%,-50%) scale(1.1);opacity:1}}
.home-orbit::before,.home-orbit::after{content:'';position:absolute;border-radius:50%;inset:0;
  border:2px solid transparent;border-top-color:rgba(99,102,241,.7);border-right-color:rgba(236,72,153,.4)}
.home-orbit::before{animation:spin 14s linear infinite}
.home-orbit::after{inset:14%;border-top-color:rgba(236,72,153,.7);border-left-color:rgba(99,102,241,.4);
  animation:spin 9s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.home-rocket{font-size:clamp(120px,26vw,180px);animation:float 3.5s ease-in-out infinite;
  filter:drop-shadow(0 20px 48px rgba(168,85,247,.9)) drop-shadow(0 0 24px rgba(236,72,153,.6));
  position:relative;z-index:1;line-height:1}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-28px) rotate(4deg)}}
.home-title{font-size:clamp(48px,10vw,88px);font-weight:900;letter-spacing:6px;margin-top:18px;
  background:linear-gradient(135deg,#60a5fa 0%,#c084fc 20%,#f472b6 40%,#fbbf24 60%,#60a5fa 80%,#c084fc 100%);
  background-size:400% 400%;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;animation:gradientShift 6s ease infinite;
  position:relative;z-index:1;filter:drop-shadow(0 4px 30px rgba(168,85,247,.8))}
@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.home-owner{font-size:clamp(24px,5vw,42px);font-weight:900;letter-spacing:4px;margin-top:8px;
  background:linear-gradient(135deg,#fbbf24,#f472b6,#a855f7);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:gradientShift 4s ease infinite;position:relative;z-index:1;
  filter:drop-shadow(0 3px 18px rgba(251,191,36,.6))}
.home-sub{font-size:clamp(18px,3.8vw,26px);color:rgba(180,200,255,.85);letter-spacing:5px;
  margin-top:6px;position:relative;z-index:1;font-weight:700;text-shadow:0 2px 12px rgba(96,165,250,.5)}
.home-stats{display:flex;gap:18px;margin:34px 0 8px;flex-wrap:wrap;justify-content:center;position:relative;z-index:1}
.home-stat{background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
  border:2px solid rgba(255,255,255,.22);border-radius:24px;padding:18px 32px;font-size:26px;
  font-weight:900;display:flex;align-items:center;gap:10px;backdrop-filter:blur(18px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 26px rgba(0,0,0,.4);text-shadow:0 2px 8px rgba(0,0,0,.4)}
.home-btns{display:flex;flex-direction:column;gap:20px;margin-top:40px;width:min(460px,90vw);position:relative;z-index:1}
.home-hint{font-size:19px;color:rgba(160,180,230,.8);margin-top:30px;line-height:1.9;
  position:relative;z-index:1;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.4)}

/* 地图 */
.map-top{display:flex;align-items:center;gap:14px;justify-content:space-between;margin-bottom:26px}
.map-title{font-size:clamp(30px,6.5vw,44px);font-weight:900;letter-spacing:5px;
  background:linear-gradient(135deg,#93c5fd,#c4b5fd,#f0abfc,#93c5fd);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 16px rgba(168,85,247,.7));animation:gradientShift 4s ease infinite}
.map-coins{background:linear-gradient(135deg,rgba(251,191,36,.3),rgba(249,115,22,.3));
  border:2.5px solid rgba(251,191,36,.7);border-radius:24px;padding:16px 28px;font-size:30px;
  font-weight:900;white-space:nowrap;display:flex;align-items:center;gap:6px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 36px rgba(251,191,36,.5);
  color:#fbbf24;text-shadow:0 0 14px rgba(251,191,36,.9)}

/* 星球卡片 - 大 2 倍 */
.planet-grid{display:flex;flex-direction:column;gap:20px;padding-bottom:30px}
.planet-card{display:flex;flex-direction:row;align-items:center;gap:30px;
  background:linear-gradient(135deg,rgba(255,255,255,.1) 0%,rgba(255,255,255,.02) 50%,rgba(255,255,255,.07) 100%);
  border:3px solid rgba(255,255,255,.18);border-radius:36px;padding:32px 36px;text-align:left;
  cursor:pointer;transition:all .3s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden;
  backdrop-filter:blur(18px);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset 0 -3px 14px rgba(0,0,0,.18),
  0 14px 44px rgba(0,0,0,.5);
  min-height:230px}
.planet-card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(circle at 30% 0%,rgba(168,85,247,.45),transparent 55%);
  opacity:0;transition:opacity .4s;pointer-events:none}
.planet-card::after{content:'';position:absolute;top:0;left:0;right:0;height:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.16) 0%,transparent 100%);
  border-radius:36px 36px 0 0;pointer-events:none}
.planet-card:active{transform:scale(.97)}
.planet-card:active::before{opacity:1}
.planet-card.locked{opacity:.55;filter:grayscale(.6);pointer-events:none}
.planet-card.done{border-color:rgba(52,211,153,.75);
  background:linear-gradient(135deg,rgba(52,211,153,.22) 0%,rgba(255,255,255,.02) 50%,rgba(52,211,153,.1) 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.24),0 0 56px rgba(52,211,153,.5),
  0 14px 44px rgba(0,0,0,.5)}
.planet-card.current{border-color:rgba(96,165,250,.95);
  background:linear-gradient(135deg,rgba(96,165,250,.24) 0%,rgba(168,85,247,.12) 50%,rgba(236,72,153,.1) 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 0 68px rgba(96,165,250,.65),
  0 14px 44px rgba(0,0,0,.5);
  animation:pulseGlow 2.4s ease-in-out infinite}
@keyframes pulseGlow{
  0%,100%{box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 0 44px rgba(96,165,250,.5),0 14px 44px rgba(0,0,0,.5)}
  50%{box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 0 90px rgba(96,165,250,.9),0 14px 44px rgba(0,0,0,.5)}}
.planet-icon{width:220px;height:220px;min-width:220px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:120px;line-height:1;
  background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.75),transparent 48%),
  radial-gradient(circle at 72% 80%,rgba(168,85,247,.6),transparent 55%),
  linear-gradient(135deg,rgba(99,102,241,.55),rgba(168,85,247,.35));
  border:4px solid rgba(255,255,255,.45);
  box-shadow:inset 0 8px 18px rgba(255,255,255,.5),inset 0 -14px 34px rgba(0,0,0,.45),
  0 18px 52px rgba(0,0,0,.6),0 0 80px rgba(168,85,247,.6);
  animation:iconFloat 3s ease-in-out infinite;position:relative;z-index:1;flex-shrink:0}
.planet-icon::before{content:'';position:absolute;inset:-20px;border-radius:50%;
  background:radial-gradient(circle,rgba(168,85,247,.55),transparent 72%);
  animation:auraPulse 2.2s ease-in-out infinite;pointer-events:none;z-index:-1}
@keyframes auraPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.25);opacity:1}}
@keyframes iconFloat{0%,100%{transform:translateY(0) scale(1) rotate(0)}50%{transform:translateY(-14px) scale(1.08) rotate(3deg)}}
.planet-card.locked .planet-icon{background:linear-gradient(135deg,rgba(60,60,80,.75),rgba(30,30,50,.65));
  border-color:rgba(120,120,140,.45);
  box-shadow:inset 0 2px 10px rgba(255,255,255,.15),inset 0 -5px 16px rgba(0,0,0,.55),0 8px 24px rgba(0,0,0,.6)}
.planet-card.locked .planet-icon::before{background:radial-gradient(circle,rgba(120,120,140,.4),transparent 72%)}
.planet-info{flex:1;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.planet-name{font-size:48px;font-weight:900;letter-spacing:4px;text-shadow:0 3px 18px rgba(0,0,0,.7)}
.planet-en{font-size:24px;color:rgba(180,200,255,.8);letter-spacing:3px;font-weight:700;text-transform:uppercase}
.planet-stars{font-size:42px;letter-spacing:8px;margin-top:8px;filter:drop-shadow(0 0 18px rgba(251,191,36,.9))}
.planet-progress{font-size:26px;color:rgba(190,215,255,.95);font-weight:800;margin-top:6px;letter-spacing:2px}
.planet-next{font-size:24px;color:#fbbf24;font-weight:900;margin-top:4px;letter-spacing:1.5px;
  text-shadow:0 0 16px rgba(251,191,36,.8)}
.planet-badge{position:absolute;top:22px;right:26px;font-size:54px;z-index:2;
  filter:drop-shadow(0 3px 14px rgba(0,0,0,.7));animation:badgeIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes badgeIn{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
.planet-boss{position:absolute;bottom:20px;right:24px;font-size:66px;opacity:.95;z-index:2;
  filter:drop-shadow(0 3px 14px rgba(239,68,68,.8));animation:bossPulse 2s ease-in-out infinite}
@keyframes bossPulse{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.18) rotate(-5deg)}}

/* 答题 */
.quiz-top{display:flex;align-items:center;gap:16px}
.progress-track{flex:1;height:26px;background:rgba(0,0,0,.55);border-radius:13px;overflow:hidden;
  border:2px solid rgba(255,255,255,.2);box-shadow:inset 0 3px 10px rgba(0,0,0,.7),0 0 28px rgba(99,102,241,.3)}
.progress-fill{height:100%;width:0;border-radius:13px;transition:width .5s cubic-bezier(.4,0,.2,1);
  background:linear-gradient(90deg,#4f8cff 0%,#a855f7 50%,#ec4899 100%);background-size:200% 100%;
  animation:progressFlow 2.5s linear infinite;
  box-shadow:0 0 24px rgba(168,85,247,1),inset 0 1px 0 rgba(255,255,255,.5)}
@keyframes progressFlow{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.combo-badge{background:linear-gradient(135deg,#fbbf24 0%,#ef4444 100%);
  border-radius:24px;padding:12px 24px;font-size:28px;font-weight:900;white-space:nowrap;
  min-width:80px;text-align:center;box-shadow:0 0 40px rgba(251,191,36,1),
  inset 0 2px 0 rgba(255,255,255,.55),0 6px 20px rgba(0,0,0,.5);display:none;
  border:2.5px solid rgba(255,255,255,.45);text-shadow:0 2px 8px rgba(0,0,0,.5)}
.combo-badge.show{display:block;animation:comboPop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes comboPop{0%{transform:scale(.3) rotate(-25deg)}60%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
.quiz-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;padding:14px 0}
.q-label{display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,rgba(99,102,241,.55),rgba(168,85,247,.55));
  border:2.5px solid rgba(168,85,247,.75);color:#f5ebff;border-radius:20px;padding:10px 24px;
  font-size:20px;font-weight:900;letter-spacing:3px;margin:0 auto 12px;align-self:center;
  box-shadow:0 0 32px rgba(168,85,247,.7),inset 0 1px 0 rgba(255,255,255,.3);
  text-shadow:0 1px 4px rgba(0,0,0,.5)}
.q-prompt{text-align:center;font-size:clamp(28px,6vw,44px);font-weight:900;line-height:1.5;
  padding:0 10px;text-shadow:0 4px 20px rgba(0,0,0,.7),0 0 28px rgba(96,165,250,.35);letter-spacing:.5px}
.q-blank{display:inline-block;min-width:70px;border-bottom:4px solid #fbbf24;margin:0 8px;
  color:#fbbf24;text-shadow:0 0 28px rgba(251,191,36,1)}
.q-passage{background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));
  border:2px solid rgba(255,255,255,.18);border-radius:26px;padding:28px 30px;
  font-size:clamp(19px,4vw,26px);line-height:1.85;color:rgba(240,245,255,.98);
  text-align:left;margin-bottom:14px;backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 30px rgba(0,0,0,.4)}
.q-passage b{color:#fbbf24;font-weight:900;text-shadow:0 0 18px rgba(251,191,36,.8)}
.options{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.opt{background:linear-gradient(160deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,.04) 100%);
  border:3px solid rgba(255,255,255,.22);border-radius:28px;padding:32px 20px;
  font-size:clamp(26px,5.5vw,36px);font-weight:900;color:#fff;font-family:inherit;cursor:pointer;
  transition:all .15s cubic-bezier(.34,1.56,.64,1);min-height:110px;display:flex;
  align-items:center;justify-content:center;letter-spacing:.5px;word-break:break-word;
  position:relative;overflow:hidden;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.25),inset 0 -4px 12px rgba(0,0,0,.22),
  0 10px 30px rgba(0,0,0,.45);text-shadow:0 3px 10px rgba(0,0,0,.5)}
.opt:active{transform:scale(.94)}
.opt.correct{background:linear-gradient(160deg,rgba(34,197,94,.75) 0%,rgba(34,197,94,.35) 100%);
  border-color:#22c55e;box-shadow:0 0 60px rgba(34,197,94,1),inset 0 3px 0 rgba(255,255,255,.55);
  animation:correctPulse .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes correctPulse{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
.opt.wrong{background:linear-gradient(160deg,rgba(239,68,68,.75) 0%,rgba(239,68,68,.35) 100%);
  border-color:#ef4444;box-shadow:0 0 52px rgba(239,68,68,.9);
  animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{0%,100%{transform:translateX(0)}10%{transform:translateX(-16px)}
  20%{transform:translateX(14px)}30%{transform:translateX(-11px)}40%{transform:translateX(9px)}
  50%{transform:translateX(-7px)}60%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
.opt:disabled{pointer-events:none}

/* 拼写 */
.spell-area{display:flex;flex-direction:column;gap:28px;align-items:center}
.spell-slots{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;min-height:110px;padding:24px;
  background:linear-gradient(160deg,rgba(0,0,0,.5),rgba(0,0,0,.25));
  border-radius:32px;border:3px dashed rgba(168,85,247,.65);
  box-shadow:inset 0 5px 20px rgba(0,0,0,.6),0 0 40px rgba(168,85,247,.35)}
.slot{width:80px;height:96px;border-radius:22px;
  background:linear-gradient(160deg,rgba(99,102,241,.35),rgba(99,102,241,.12));
  border:3px solid rgba(99,102,241,.7);display:flex;align-items:center;justify-content:center;
  font-size:40px;font-weight:900;color:#c7d2fe;cursor:pointer;
  transition:all .15s cubic-bezier(.34,1.56,.64,1);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.3),0 8px 22px rgba(0,0,0,.4)}
.slot:active{transform:scale(.88)}
.slot.filled{background:linear-gradient(160deg,rgba(99,102,241,.85),rgba(168,85,247,.65));
  border-color:#a855f7;color:#fff;
  box-shadow:0 0 42px rgba(168,85,247,1),inset 0 3px 0 rgba(255,255,255,.55),0 8px 22px rgba(0,0,0,.55);
  animation:slotFill .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes slotFill{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.letter-pool{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.letter{width:88px;height:96px;border-radius:24px;
  background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,.06));
  border:3px solid rgba(255,255,255,.3);color:#fff;font-size:40px;font-weight:900;font-family:inherit;
  cursor:pointer;transition:all .15s cubic-bezier(.34,1.56,.64,1);
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.38),inset 0 -5px 14px rgba(0,0,0,.22),
  0 8px 24px rgba(0,0,0,.45);text-shadow:0 3px 8px rgba(0,0,0,.5)}
.letter:active{transform:scale(.85)}
.letter.used{opacity:.1;pointer-events:none;transform:scale(.75)}

/* 连词成句 */
.order-area{display:flex;flex-direction:column;gap:26px;align-items:center}
.order-zone{min-height:150px;width:100%;
  background:linear-gradient(160deg,rgba(0,0,0,.5),rgba(0,0,0,.25));
  border-radius:32px;border:3px dashed rgba(99,102,241,.65);padding:24px;display:flex;
  flex-wrap:wrap;gap:16px;justify-content:center;align-items:center;
  box-shadow:inset 0 5px 20px rgba(0,0,0,.6),0 0 40px rgba(99,102,241,.35)}
.order-word{background:linear-gradient(160deg,rgba(99,102,241,.65),rgba(168,85,247,.45));
  border:3px solid rgba(168,85,247,.85);border-radius:24px;padding:22px 32px;font-size:34px;
  font-weight:900;color:#fff;cursor:pointer;font-family:inherit;
  transition:all .15s cubic-bezier(.34,1.56,.64,1);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 8px 26px rgba(99,102,241,.55);
  text-shadow:0 3px 8px rgba(0,0,0,.55)}
.order-word:active{transform:scale(.9)}
.word-pool{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.word-pool .order-word{background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,.06));
  border-color:rgba(255,255,255,.32);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.38),0 8px 24px rgba(0,0,0,.45)}
.word-pool .order-word.used{opacity:.1;pointer-events:none;transform:scale(.75)}

/* 听力 */
.listen-btn{width:220px;height:220px;border-radius:50%;
  background:linear-gradient(135deg,#4f8cff 0%,#a855f7 50%,#ec4899 100%);
  border:none;font-size:100px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  margin:0 auto;color:#fff;transition:transform .15s cubic-bezier(.34,1.56,.64,1);position:relative;
  box-shadow:0 24px 80px rgba(168,85,247,.95),inset 0 6px 0 rgba(255,255,255,.55),
  inset 0 -10px 26px rgba(0,0,0,.3)}
.listen-btn::before{content:'';position:absolute;inset:-18px;border-radius:50%;
  border:4px solid rgba(168,85,247,.7);animation:listenRing 1.8s ease-out infinite}
.listen-btn::after{content:'';position:absolute;inset:-36px;border-radius:50%;
  border:4px solid rgba(99,102,241,.5);animation:listenRing 1.8s ease-out infinite .5s}
@keyframes listenRing{0%{transform:scale(1);opacity:1}100%{transform:scale(1.7);opacity:0}}
.listen-btn:active{transform:scale(.9)}

/* 跟读 */
.speak-sentence{background:linear-gradient(160deg,rgba(96,165,250,.18),rgba(168,85,247,.1));
  border:2.5px solid rgba(96,165,250,.65);border-radius:28px;padding:36px 38px;
  font-size:clamp(28px,6vw,42px);font-weight:900;color:#e0f2fe;text-align:center;line-height:1.6;
  backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 12px 44px rgba(96,165,250,.55);
  text-shadow:0 4px 18px rgba(0,0,0,.6),0 0 24px rgba(96,165,250,.45)}
.speak-mic{width:190px;height:190px;border-radius:50%;
  background:linear-gradient(135deg,#ef4444 0%,#f59e0b 100%);
  border:none;font-size:88px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  margin:0 auto;color:#fff;transition:transform .15s cubic-bezier(.34,1.56,.64,1);position:relative;
  box-shadow:0 24px 80px rgba(239,68,68,.9),inset 0 6px 0 rgba(255,255,255,.55),
  inset 0 -10px 26px rgba(0,0,0,.3)}
.speak-mic:active{transform:scale(.9)}
.speak-mic.recording{animation:micPulse .9s ease-in-out infinite}
@keyframes micPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.speak-status{text-align:center;font-size:23px;color:rgba(190,210,255,.95);min-height:38px;
  font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.6);padding:0 10px;line-height:1.5}
.speak-tip{text-align:center;font-size:18px;color:rgba(160,180,230,.85);margin-top:10px;
  line-height:1.6;padding:0 14px;text-shadow:0 1px 4px rgba(0,0,0,.5)}

/* BOSS */
.boss-top{display:flex;align-items:center;gap:14px;position:relative;z-index:2}
.boss-timer{background:linear-gradient(135deg,#ef4444 0%,#f59e0b 100%);
  border-radius:24px;padding:18px 30px;font-size:38px;font-weight:900;min-width:150px;text-align:center;
  font-variant-numeric:tabular-nums;
  box-shadow:0 0 56px rgba(239,68,68,1),inset 0 3px 0 rgba(255,255,255,.45),0 10px 30px rgba(0,0,0,.6);
  border:2.5px solid rgba(255,255,255,.4);text-shadow:0 3px 10px rgba(0,0,0,.6)}
.boss-timer.warn{animation:timerWarn .5s ease-in-out infinite}
@keyframes timerWarn{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.boss-arena{display:flex;flex-direction:column;align-items:center;gap:26px;padding:30px 0;position:relative;z-index:2}
.boss-hp-track{width:100%;height:50px;background:linear-gradient(160deg,rgba(0,0,0,.85),rgba(0,0,0,.6));
  border-radius:25px;overflow:hidden;border:3px solid rgba(255,255,255,.32);position:relative;
  box-shadow:inset 0 6px 18px rgba(0,0,0,.85),0 0 40px rgba(239,68,68,.45)}
.boss-hp-fill{height:100%;width:100%;border-radius:22px;transition:width .7s cubic-bezier(.4,0,.2,1);
  background:linear-gradient(90deg,#ef4444 0%,#f59e0b 50%,#fbbf24 100%);background-size:200% 100%;
  animation:hpFlow 1.8s linear infinite;
  box-shadow:0 0 40px rgba(239,68,68,1),inset 0 3px 0 rgba(255,255,255,.45)}
@keyframes hpFlow{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.boss-hp-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:22px;font-weight:900;text-shadow:0 3px 10px #000,0 0 20px #000;letter-spacing:4px}
.boss-avatar{font-size:clamp(180px,36vw,280px);line-height:1;position:relative;
  filter:drop-shadow(0 24px 72px rgba(255,80,80,.95)) drop-shadow(0 0 48px rgba(239,68,68,.55));
  animation:bossIdle 2.8s ease-in-out infinite;transition:transform .3s}
.boss-avatar::before{content:'';position:absolute;inset:-40%;border-radius:50%;
  background:radial-gradient(circle,rgba(239,68,68,.4) 0%,transparent 62%);
  animation:bossAura 2s ease-in-out infinite;pointer-events:none}
@keyframes bossAura{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.25);opacity:1}}
@keyframes bossIdle{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-18px) scale(1.04)}}
.boss-avatar.hit{animation:bossHit .6s cubic-bezier(.36,.07,.19,.97)}
@keyframes bossHit{0%{transform:scale(1);filter:brightness(1)}
  10%{transform:scale(1.3) translateX(-26px);filter:brightness(5) drop-shadow(0 0 120px #fbbf24) hue-rotate(30deg)}
  30%{transform:scale(.82) translateX(20px);filter:brightness(.5) hue-rotate(-20deg)}
  55%{transform:scale(1.1) translateX(-12px);filter:brightness(2)}
  80%{transform:scale(.96) translateX(8px);filter:brightness(1.2)}
  100%{transform:scale(1);filter:brightness(1)}}
.boss-name{font-size:44px;font-weight:900;letter-spacing:8px;
  background:linear-gradient(135deg,#ef4444,#fbbf24,#ef4444);background-size:200% 100%;
  animation:gradientShift 3s ease infinite;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 8px 28px rgba(239,68,68,.95))}
.boss-q{text-align:center;font-size:clamp(26px,5.5vw,38px);font-weight:900;line-height:1.55;
  padding:16px 18px;position:relative;z-index:2;text-shadow:0 4px 18px rgba(0,0,0,.7)}
.boss-options{display:grid;grid-template-columns:1fr 1fr;gap:18px;position:relative;z-index:2}
.boss-opt{background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
  border:3px solid rgba(255,255,255,.25);border-radius:28px;padding:28px 20px;
  font-size:clamp(24px,5vw,32px);font-weight:900;color:#fff;font-family:inherit;cursor:pointer;
  min-height:100px;display:flex;align-items:center;justify-content:center;
  transition:all .15s cubic-bezier(.34,1.56,.64,1);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.25),inset 0 -4px 12px rgba(0,0,0,.22),0 10px 28px rgba(0,0,0,.5);
  text-shadow:0 3px 10px rgba(0,0,0,.5)}
.boss-opt:active{transform:scale(.94)}
.boss-opt.correct{background:linear-gradient(160deg,rgba(34,197,94,.8),rgba(34,197,94,.4));
  border-color:#22c55e;box-shadow:0 0 60px rgba(34,197,94,1),inset 0 3px 0 rgba(255,255,255,.55)}
.boss-opt.wrong{background:linear-gradient(160deg,rgba(239,68,68,.8),rgba(239,68,68,.4));
  border-color:#ef4444;animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
.damage-num{position:fixed;font-size:68px;font-weight:900;color:#fbbf24;
  text-shadow:0 0 24px #fbbf24,0 0 48px #ef4444,0 5px 14px #000;
  pointer-events:none;z-index:80;animation:dmgFloat 1s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes dmgFloat{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-20deg)}
  30%{opacity:1;transform:translate(-50%,-50%) scale(1.4) rotate(5deg)}
  70%{opacity:1;transform:translate(-50%,-80%) scale(1.1) rotate(-3deg)}
  100%{opacity:0;transform:translate(-50%,-140%) scale(.9) rotate(0)}}

/* 商店 */
.shop-top{display:flex;align-items:center;gap:14px;justify-content:space-between;margin-bottom:24px}
.shop-money{background:linear-gradient(135deg,#fbbf24 0%,#f97316 100%);
  border-radius:24px;padding:18px 30px;font-size:32px;font-weight:900;color:#1a0a00;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 0 56px rgba(251,191,36,.8),inset 0 3px 0 rgba(255,255,255,.6),0 10px 30px rgba(0,0,0,.5);
  border:2.5px solid rgba(255,255,255,.55)}
.shop-section{background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
  border:2px solid rgba(255,255,255,.16);border-radius:34px;padding:30px;margin-bottom:24px;
  backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 12px 40px rgba(0,0,0,.45)}
.shop-section h3{font-size:30px;font-weight:900;margin-bottom:24px;letter-spacing:3px;
  background:linear-gradient(135deg,#93c5fd,#c4b5fd,#f0abfc);background-size:200% 100%;
  animation:gradientShift 4s ease infinite;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.shop-item{background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
  border:2px solid rgba(255,255,255,.22);border-radius:28px;padding:26px 20px;text-align:center;
  cursor:pointer;transition:all .15s cubic-bezier(.34,1.56,.64,1);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.25),0 8px 24px rgba(0,0,0,.4)}
.shop-item:active{transform:scale(.94)}
.shop-item.owned{border-color:rgba(52,211,153,.85);
  background:linear-gradient(160deg,rgba(52,211,153,.25),rgba(52,211,153,.08));
  box-shadow:inset 0 3px 0 rgba(255,255,255,.25),0 0 40px rgba(52,211,153,.55),0 8px 24px rgba(0,0,0,.4)}
.shop-item .icon{font-size:72px;line-height:1;filter:drop-shadow(0 8px 20px rgba(0,0,0,.5))}
.shop-item .name{font-size:24px;font-weight:900;margin-top:16px;letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.shop-item .price{font-size:22px;color:#fbbf24;font-weight:900;margin-top:12px;
  display:flex;align-items:center;justify-content:center;gap:6px;text-shadow:0 0 18px rgba(251,191,36,.9)}
.shop-item .own-tag{font-size:20px;color:#34d399;font-weight:900;margin-top:12px;text-shadow:0 0 18px rgba(52,211,153,.9)}

/* 结果 */
#s-result{align-items:center;justify-content:center}
.result-card{background:linear-gradient(160deg,rgba(20,26,50,.98),rgba(15,18,40,.96));
  border:3px solid rgba(168,85,247,.6);border-radius:48px;padding:56px 40px;text-align:center;
  width:min(600px,95vw);backdrop-filter:blur(32px);
  box-shadow:0 40px 140px rgba(0,0,0,.9),0 0 100px rgba(168,85,247,.45),inset 0 3px 0 rgba(255,255,255,.22);
  animation:cardIn .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes cardIn{0%{opacity:0;transform:scale(.6) translateY(40px) rotate(-5deg)}
  100%{opacity:1;transform:scale(1) translateY(0) rotate(0)}}
.result-stars{font-size:130px;letter-spacing:22px;margin-bottom:26px;min-height:150px}
.result-star{display:inline-block;opacity:0;animation:starIn .6s cubic-bezier(.34,1.56,.64,1) forwards;
  filter:drop-shadow(0 0 36px rgba(251,191,36,1)) drop-shadow(0 0 72px rgba(251,191,36,.7))}
.result-star:nth-child(1){animation-delay:.15s}
.result-star:nth-child(2){animation-delay:.4s}
.result-star:nth-child(3){animation-delay:.65s}
@keyframes starIn{0%{opacity:0;transform:scale(0) rotate(-180deg)}70%{transform:scale(1.6) rotate(20deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.result-title{font-size:54px;font-weight:900;letter-spacing:8px;margin-bottom:20px;
  background:linear-gradient(135deg,#fbbf24 0%,#f472b6 33%,#a855f7 66%,#60a5fa 100%);
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;animation:gradientShift 3s ease infinite;
  filter:drop-shadow(0 8px 30px rgba(244,114,182,.85))}
.result-sub{font-size:26px;color:rgba(190,210,255,.9);margin-bottom:42px;font-weight:700;text-shadow:0 3px 10px rgba(0,0,0,.5)}
.reward-list{display:flex;flex-direction:column;gap:20px;margin-bottom:42px}
.reward-item{background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
  border:2px solid rgba(255,255,255,.2);border-radius:28px;padding:24px 34px;
  font-size:28px;font-weight:900;display:flex;justify-content:space-between;align-items:center;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.22),0 8px 26px rgba(0,0,0,.4);text-shadow:0 3px 10px rgba(0,0,0,.5)}
.reward-val{color:#fbbf24;font-size:34px;text-shadow:0 0 28px rgba(251,191,36,1);
  display:flex;align-items:center;gap:8px}

/* 提示 */
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);left:50%;
  transform:translateX(-50%) translateY(200px);
  background:linear-gradient(160deg,rgba(30,40,70,.99),rgba(20,25,50,.99));
  border:3px solid rgba(168,85,247,.75);border-radius:32px;padding:28px 48px;
  font-size:26px;font-weight:900;z-index:100;transition:transform .5s cubic-bezier(.34,1.56,.64,1);
  backdrop-filter:blur(24px);max-width:90vw;text-align:center;
  box-shadow:0 32px 100px rgba(0,0,0,.85),0 0 60px rgba(168,85,247,.55),inset 0 3px 0 rgba(255,255,255,.25);
  letter-spacing:.6px;text-shadow:0 3px 10px rgba(0,0,0,.5)}
.toast.show{transform:translateX(-50%) translateY(0)}

.modal-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.87);z-index:200;
  display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(18px)}
.modal-mask.show{display:flex}
.modal-box{background:linear-gradient(160deg,rgba(20,26,50,.99),rgba(15,18,40,.99));
  border:3px solid rgba(168,85,247,.55);border-radius:48px;padding:56px 40px;text-align:center;
  width:min(560px,92vw);animation:cardIn .4s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 40px 140px rgba(0,0,0,.9),0 0 100px rgba(168,85,247,.45),inset 0 3px 0 rgba(255,255,255,.22)}
.modal-box h3{font-size:42px;margin-bottom:24px;font-weight:900;letter-spacing:2px;text-shadow:0 4px 16px rgba(0,0,0,.6)}
.modal-box p{font-size:24px;color:rgba(190,210,255,.9);line-height:1.75;margin-bottom:38px;font-weight:600}
.modal-btns{display:flex;gap:20px}
.modal-btns .btn{flex:1;font-size:26px;padding:24px;min-height:80px}

.feedback{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.4);
  font-size:240px;opacity:0;pointer-events:none;z-index:70;
  filter:drop-shadow(0 0 60px rgba(255,255,255,1)) drop-shadow(0 0 24px currentColor)}
.feedback.show{animation:fbPop 1.1s cubic-bezier(.34,1.56,.64,1)}
@keyframes fbPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-30deg)}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1.6) rotate(10deg)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(2) rotate(0)}}

#fatal-error{position:fixed;top:0;left:0;right:0;background:#dc2626;color:#fff;padding:14px;
  z-index:99999;font-size:14px;font-family:monospace;white-space:pre-wrap;max-height:35vh;overflow:auto;display:none}
body.shake-lv1{animation:screenShake1 .4s cubic-bezier(.36,.07,.19,.97)}
body.shake-lv2{animation:screenShake2 .55s cubic-bezier(.36,.07,.19,.97)}
body.shake-lv3{animation:screenShake3 .7s cubic-bezier(.36,.07,.19,.97)}
@keyframes screenShake1{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,5px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-5px,4px)}80%{transform:translate(4px,-3px)}}
@keyframes screenShake2{0%,100%{transform:translate(0,0)}10%{transform:translate(-16px,10px)}20%{transform:translate(13px,-8px)}30%{transform:translate(-12px,9px)}40%{transform:translate(10px,-6px)}50%{transform:translate(-8px,5px)}60%{transform:translate(6px,-4px)}80%{transform:translate(-3px,2px)}}
@keyframes screenShake3{0%,100%{transform:translate(0,0)}8%{transform:translate(-24px,16px)}16%{transform:translate(20px,-12px)}24%{transform:translate(-17px,13px)}32%{transform:translate(14px,-9px)}40%{transform:translate(-12px,8px)}50%{transform:translate(9px,-6px)}60%{transform:translate(-7px,4px)}80%{transform:translate(-3px,2px)}}
body.flash-red::before{content:'';position:fixed;inset:0;background:radial-gradient(circle,rgba(239,68,68,.55),transparent 70%);pointer-events:none;z-index:55;animation:flashFade .45s ease-out}
body.flash-gold::before{content:'';position:fixed;inset:0;background:radial-gradient(circle,rgba(251,191,36,.65),transparent 70%);pointer-events:none;z-index:55;animation:flashFade .55s ease-out}
body.flash-white::before{content:'';position:fixed;inset:0;background:radial-gradient(circle,rgba(255,255,255,.75),transparent 70%);pointer-events:none;z-index:55;animation:flashFade .3s ease-out}
@keyframes flashFade{0%{opacity:1}100%{opacity:0}}

/* 小屏（iPad mini 竖屏）适配：缩小一点避免溢出 */
@media (max-width:820px){
  .planet-icon{width:170px;height:170px;min-width:170px;font-size:92px}
  .planet-name{font-size:38px}
  .planet-en{font-size:20px}
  .planet-stars{font-size:34px}
  .planet-progress{font-size:22px}
  .planet-next{font-size:20px}
  .planet-card{padding:26px 28px;min-height:190px;gap:24px}
  .opt{font-size:clamp(22px,4.5vw,30px);padding:26px 16px;min-height:92px}
  .boss-avatar{font-size:clamp(140px,30vw,220px)}
  .boss-name{font-size:36px}
  .boss-opt{font-size:clamp(20px,4vw,26px);padding:22px 16px;min-height:84px}
  .home-title{font-size:clamp(40px,9vw,72px)}
  .home-owner{font-size:clamp(20px,4.5vw,34px)}
  .home-sub{font-size:clamp(16px,3.4vw,22px)}
  .slot,.letter{width:64px;height:78px;font-size:34px}
  .listen-btn{width:180px;height:180px;font-size:84px}
  .speak-mic{width:160px;height:160px;font-size:72px}
  .speak-sentence{font-size:clamp(24px,5vw,34px);padding:30px 30px}
  .btn-primary{font-size:28px;padding:24px 34px;min-height:80px}
  .btn-ghost{font-size:20px;padding:18px 26px;min-height:64px}
  .q-prompt{font-size:clamp(24px,5vw,36px)}
  .q-passage{font-size:clamp(17px,3.6vw,22px);padding:24px 26px}
  .boss-q{font-size:clamp(22px,4.8vw,32px)}
  .map-title{font-size:clamp(26px,6vw,38px)}
  .map-coins{font-size:26px;padding:14px 24px}
  .icon-btn{width:64px;height:64px;font-size:26px}
}
</style>
</head>

<canvas id="bgCanvas"></canvas>
<canvas id="fxCanvas"></canvas>
<div id="fatal-error"></div>
<div id="app">
  <div class="screen active" id="s-home">

    <h1 class="home-title">星际英语探险</h1>

    <p class="home-sub">四年级上册 · 译林版</p>

      <div class="home-stat">⭐ <span id="home-stars">0</span></div>
      <div class="home-stat"><span class="coin-icon"></span> <span id="home-coins">0</span></div>

    </div>
    <div class="home-btns">
      <button class="btn btn-primary" id="btn-continue-game" style="display:none">▶ 继续上次</button>

function shuffleArray(arr){
  var a = [];
  for(var i=0;i<arr.length;i++) a.push(arr[i]);
  for(var j=a.length-1;j>0;j--){ var k = Math.floor(Math.random()*(j+1)); var t = a[j]; a[j] = a[k]; a[k] = t; }
  return a;
}
function randomizeQuestion(q){
  var nq = {};
  for(var key in q){ if(q.hasOwnProperty(key)) nq[key] = q[key]; }
  if(nq.o && typeof nq.a === 'number' && nq.o.length > 1){
    var correctText = nq.o[nq.a];
    nq.o = shuffleArray(nq.o);
    nq.a = nq.o.indexOf(correctText);
    if(nq.a < 0) nq.a = 0;
  }
  return nq;
}
function randomizeLevel(qs){
  var shuffled = shuffleArray(qs);
  var result = [];
  for(var i=0;i<shuffled.length;i++) result.push(randomizeQuestion(shuffled[i]));
  return result;
}

function defaultSave(){

    badges:[], stars:{}, cleared:[], currentPlanet:1,
    currentLevel:0, wrongBook:[], levelRewarded:{},

function checkDaily(){
  if(!save) return;
  var today = new Date().toDateString();
  if(!save.daily || save.daily.date !== today){
    save.daily = {date:today, seconds:0, warned:false};
    persist();
  }
}
function writeMiniCookie(){
  try{
    var mini = {v:13, st:save.stars, c:save.cleared, co:save.coins, b:save.badges,
      p:save.currentPlanet, l:save.currentLevel, o:save.owned, t:save.totalScore,
      s:save.streak, m:save.maxStreak, d:save.daily, rw:save.levelRewarded};
    document.cookie = COOKIE_KEY + '=' + encodeURIComponent(JSON.stringify(mini)) + ';max-age=31536000;path=/;SameSite=Lax';
  }catch(e){}
}
function readMiniCookie(){
  try{
    var ck = document.cookie.split(';');
    for(var i=0;i<ck.length;i++){
      var c = ck[i].trim();
      if(c.indexOf(COOKIE_KEY + '=') === 0){
        return JSON.parse(decodeURIComponent(c.substring(COOKIE_KEY.length + 1)));
      }
    }
  }catch(e){}
  return null;
}
function persist(){
  if(!save) return;
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){}
  writeMiniCookie();
}
function loadSave(){
  var raw = null;
  try{ raw = localStorage.getItem(SAVE_KEY); }catch(e){}
  if(raw){
    try{
      var s = JSON.parse(raw);
      var d = defaultSave();
      for(var k in s){ if(s.hasOwnProperty(k)) d[k] = s[k]; }
      save = d;
      if(!save.daily) save.daily = {date:'',seconds:0,warned:false};
      if(!save.wrongBook) save.wrongBook = [];
      if(!save.stars) save.stars = {};
      if(!save.cleared) save.cleared = [];
      if(!save.owned) save.owned = [];
      if(!save.levelRewarded) save.levelRewarded = {};
      if(typeof save.currentLevel !== 'number') save.currentLevel = 0;
      if(!save.currentPlanet) save.currentPlanet = 1;
      checkDaily();
      return;
    }catch(e){}
  }
  var mini = readMiniCookie();
  if(mini){
    var d2 = defaultSave();
    d2.stars = mini.st || {};
    d2.cleared = mini.c || [];
    d2.coins = mini.co || 0;
    d2.badges = mini.b || [];
    d2.daily = mini.d || d2.daily;
    d2.currentPlanet = mini.p || 1;
    d2.currentLevel = mini.l || 0;
    d2.owned = mini.o || [];
    d2.totalScore = mini.t || 0;
    d2.streak = mini.s || 0;
    d2.maxStreak = mini.m || 0;
    d2.levelRewarded = mini.rw || {};
    save = d2;
    checkDaily();
    return;
  }
  save = defaultSave();
  checkDaily();
}
function totalStars(){

function tone(f, d, t, v, delay){
  if(!audioCtx || (save && save.muted)) return;
  try{
    var t0 = audioCtx.currentTime + (delay || 0);
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = t || 'sine';
    o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v || 0.07, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + d + 0.05);
  }catch(e){}
}

function getEnglishVoice(){
  if(englishVoice) return englishVoice;
  try{
    var voices = window.speechSynthesis.getVoices();
    if(!voices || voices.length === 0) return null;
    var fallback = null;
    for(var i=0;i<voices.length;i++){
      var v = voices[i];
      if(!v.lang) continue;
      var lang = v.lang.toLowerCase();
      if(lang.indexOf('en-us') === 0 || lang.indexOf('en_us') === 0){ englishVoice = v; return v; }
      if(!fallback && lang.indexOf('en') === 0) fallback = v;
    }
    if(fallback){ englishVoice = fallback; return fallback; }
  }catch(e){}
  return null;
}
function unlockSpeech(){
  if(speechUnlocked || !speechReady) return;
  try{
    var u = new SpeechSynthesisUtterance(' ');
    u.lang = 'en-US'; u.volume = 0; u.rate = 1;
    window.speechSynthesis.speak(u);
    speechUnlocked = true;
    setTimeout(function(){ try{ getEnglishVoice(); }catch(e){} }, 200);
  }catch(e){}
}
function speak(text){
  if(!save || save.muted || !speechReady || !text) return;
  try{
    if(!englishVoice) getEnglishVoice();
    window.speechSynthesis.cancel();
    setTimeout(function(){
      try{
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US'; u.rate = 0.8; u.pitch = 1.1; u.volume = 1.0;
        var v = getEnglishVoice();
        if(v) u.voice = v;
        window.speechSynthesis.speak(u);
      }catch(e){}
    }, 60);
  }catch(e){}
}
function speakWithDelay(text){
  if(!text) return;
  setTimeout(function(){ speak(text); }, 500);
  setTimeout(function(){ speak(text); }, 1500);
}

}

  }

function bgLoop(){
  if(!bgCtx) return;
  bgT += 1;
  var t = bgT;
  bgCtx.clearRect(0,0,W,H);
  var g = bgCtx.createRadialGradient(W*0.5,H*0.35,0,W*0.5,H*0.55,Math.max(W,H)*1.0);
  g.addColorStop(0,'#1a1440'); g.addColorStop(0.4,'#0c0a28'); g.addColorStop(1,'#04021a');
  bgCtx.fillStyle = g; bgCtx.fillRect(0,0,W,H);
  bgCtx.globalCompositeOperation = 'screen';
  for(var ni=0; ni<bgNebulas.length; ni++){
    var nb = bgNebulas[ni];
    var px = nb.x + Math.sin(t*nb.speed + nb.phase)*100;
    var py = nb.y + Math.cos(t*nb.speed + nb.phase*1.3)*80;
    var ng = bgCtx.createRadialGradient(px,py,0,px,py,nb.r);
    ng.addColorStop(0,'hsla(' + nb.hue + ',85%,62%,0.22)');
    ng.addColorStop(0.5,'hsla(' + (nb.hue+40) + ',85%,52%,0.1)');
    ng.addColorStop(1,'hsla(' + nb.hue + ',85%,52%,0)');
    bgCtx.fillStyle = ng;
    bgCtx.beginPath(); bgCtx.arc(px,py,nb.r,0,Math.PI*2); bgCtx.fill();
  }
  bgCtx.globalCompositeOperation = 'source-over';
  for(var i=0;i<bgStars.length;i++){
    var s = bgStars[i];
    var a = s.a * (0.5 + 0.5*Math.sin(t*s.s*0.05 + s.p));
    bgCtx.globalAlpha = a;
    bgCtx.fillStyle = 'hsl(' + s.hue + ',85%,85%)';
    bgCtx.beginPath(); bgCtx.arc(s.x, s.y, s.r, 0, Math.PI*2); bgCtx.fill();
    if(s.r > 1.2){
      bgCtx.globalAlpha = a*0.35;
      bgCtx.beginPath(); bgCtx.arc(s.x, s.y, s.r*3.5, 0, Math.PI*2); bgCtx.fill();
    }
  }
  bgCtx.globalAlpha = 1;
  if(t - lastShootT > 4500 && Math.random() < 0.03){
    lastShootT = t;
    bgShoots.push({x:Math.random()*W*0.7 + W*0.15,y:-30,
      vx:(Math.random()*0.5+0.6)*4.5,vy:(Math.random()*0.3+0.5)*4.5,life:1});
  }
  for(var j=bgShoots.length-1;j>=0;j--){
    var sh = bgShoots[j];
    sh.x += sh.vx; sh.y += sh.vy; sh.life -= 0.014;
    if(sh.life <= 0 || sh.y > H+50){ bgShoots.splice(j,1); continue; }
    var sg = bgCtx.createLinearGradient(sh.x,sh.y,sh.x - sh.vx*16, sh.y - sh.vy*16);
    sg.addColorStop(0,'rgba(255,255,255,' + (sh.life*1) + ')');
    sg.addColorStop(0.4,'rgba(180,200,255,' + (sh.life*0.6) + ')');
    sg.addColorStop(1,'rgba(180,200,255,0)');
    bgCtx.strokeStyle = sg; bgCtx.lineWidth = 3; bgCtx.lineCap = 'round';
    bgCtx.beginPath(); bgCtx.moveTo(sh.x, sh.y); bgCtx.lineTo(sh.x - sh.vx*16, sh.y - sh.vy*16); bgCtx.stroke();
  }
  requestAnimationFrame(bgLoop);
}
function fxLoop(){
  if(!fxCtx) return;
  fxCtx.clearRect(0,0,W,H);
  for(var i=fxParticles.length-1;i>=0;i--){
    var p = fxParticles[i];
    p.life -= 0.02;
    if(p.life <= 0){ fxParticles.splice(i,1); continue; }
    p.x += p.vx; p.y += p.vy; p.vy += p.g;
    p.vx *= 0.985; p.vy *= 0.985;
    var a = p.life / p.maxLife;
    fxCtx.globalAlpha = a;
    if(p.type === 'spark'){
      fxCtx.fillStyle = p.color;
      fxCtx.shadowColor = p.color; fxCtx.shadowBlur = 22;
      fxCtx.beginPath(); fxCtx.arc(p.x, p.y, p.size * a, 0, Math.PI*2); fxCtx.fill();
    } else if(p.type === 'ring'){
      fxCtx.strokeStyle = p.color;
      fxCtx.lineWidth = 6 * a;
      fxCtx.shadowColor = p.color; fxCtx.shadowBlur = 34;
      fxCtx.beginPath(); fxCtx.arc(p.x, p.y, p.size * (1 - a) + 10, 0, Math.PI*2); fxCtx.stroke();
    }
  }
  fxCtx.globalAlpha = 1;
  fxCtx.shadowBlur = 0;
  requestAnimationFrame(fxLoop);
}

function renderSpell(q, qb){
  addLabel('拼写题', qb); addPrompt('拼写：' + q.hint, qb);
  var area = document.createElement('div'); area.className='spell-area';
  var slots = document.createElement('div'); slots.className='spell-slots'; area.appendChild(slots);
  var pool = document.createElement('div'); pool.className='letter-pool'; area.appendChild(pool);
  qb.appendChild(area);
  var target = (q.word||'').toUpperCase();
  var len = target.length;
  var filled = []; for(var i=0;i<len;i++) filled.push(null);
  var extra = (q.extra||'').split('');
  var exCount = Math.max(2, Math.min(3, Math.floor(len/3)));
  var poolLetters = target.split('').concat(extra.slice(0, exCount));
  poolLetters = shuffleArray(poolLetters);
  function renderSlots(){
    slots.innerHTML = '';
    for(var k=0;k<len;k++){
      (function(idx){
        var s = document.createElement('div');
        s.className='slot' + (filled[idx]?' filled':'');
        s.textContent = filled[idx]||'';
        if(filled[idx]){
          s.onclick = function(){
            var rm = filled[idx]; filled[idx] = null;
            var btns = pool.querySelectorAll('.letter');
            for(var m=0;m<btns.length;m++){
              if(btns[m].textContent===rm && btns[m].classList.contains('used')){
                btns[m].classList.remove('used'); break;

            renderSlots();
          };

        slots.appendChild(s);
      })(k);

  }
  for(var li=0; li<poolLetters.length; li++){
    (function(ch){
      var b = document.createElement('button');

      b.onclick = function(){
        if(b.classList.contains('used')) return;
        var ei = filled.indexOf(null); if(ei===-1) return;
        filled[ei] = ch; b.classList.add('used'); renderSlots();
        if(filled.indexOf(null) === -1){
          var ans = filled.join('');
          setTimeout(function(){
            if(ans===target){
              correctFlow(); speak(q.word);
              setTimeout(nextQuestion, 1000);
            } else {
              wrongFlow(q);
              setTimeout(function(){
                for(var m=0;m<len;m++) filled[m] = null;
                var btns = pool.querySelectorAll('.letter');
                for(var n=0;n<btns.length;n++){ btns[n].classList.remove('used'); }
                renderSlots();
                showToast('再试一次，你可以的！');
              }, 700);
            }
          }, 200);
        }
      };
      pool.appendChild(b);
    })(poolLetters[li]);
  }
  renderSlots();
}

      else if(err && err.name === 'NotFoundError'){ tip.textContent = '⚠️ 没有找到麦克风设备。'; }

          else { msg = '识别出错：' + e.error; }

      mic.classList.remove('recording'); rec = null;
    }
  };
  doneBtn.onclick = function(){ correctFlow(); setTimeout(nextQuestion, 800); };
}
function similarity(a,b){
  if(!a || !b) return 0;
  var longer = a.length > b.length ? a : b;
  var shorter = a.length > b.length ? b : a;
  if(longer.length === 0) return 1;
  return (longer.length - editDistance(longer, shorter)) / longer.length;
}
function editDistance(a,b){
  var d = [];
  for(var i=0;i<=b.length;i++) d[i] = [i];
  for(var j=0;j<=a.length;j++) d[0][j] = j;
  for(var i2=1;i2<=b.length;i2++){
    for(var j2=1;j2<=a.length;j2++){
      d[i2][j2] = b.charAt(i2-1)===a.charAt(j2-1) ? d[i2-1][j2-1] : Math.min(d[i2-1][j2-1]+1, d[i2][j2-1]+1, d[i2-1][j2]+1);
    }
  }
  return d[b.length][a.length];
}
function correctFlow(){
  sfxCorrect(); showFeedback('✅');
  G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo);
  var bonus = G.combo >= 3 ? 2 : 1;
  G.earned += bonus;
  sfxCoin();
  sparkle(W/2, H*0.4, '#fbbf24', 28);
}
function wrongFlow(q){
  sfxWrong(); showFeedback('❌');
  G.wrongCount++; G.combo = 0; updateCombo();
  recordWrong(q);
}
function answerChoice(btn, idx, correct, explain){

    if(explain) showToast('正确答案：' + explain, 2200);
    setTimeout(function(){ G.locked = false; nextQuestion(); }, 1600);

}

/* 关键修复：判断整单元是否完成，正确匹配 BOSS 的 'boss' 键 */
function endLevel(){
  try{
    stopTimer();
    var total = G.qs.length;
    var wrong = G.wrongCount;
    var stars = wrong===0 ? 3 : (wrong===1 ? 2 : 1);
    var pid = 'u' + G.unit.id;
    if(!save.stars[pid]) save.stars[pid] = {};
    var lidx = G.levelIdx;
    var oldStars = save.stars[pid][lidx] || 0;
    var newStars = stars > oldStars ? stars : oldStars;
    save.stars[pid][lidx] = newStars;

    var rewardKey = pid + '_L' + lidx;
    if(!save.levelRewarded) save.levelRewarded = {};
    var alreadyGiven = save.levelRewarded[rewardKey] || 0;
    var shouldGive = stars === 3 ? 10 : (stars === 2 ? 6 : 3);
    var coinDelta = 0;
    if(stars > oldStars){
      coinDelta = shouldGive - alreadyGiven;
      if(coinDelta < 0) coinDelta = 0;
      save.levelRewarded[rewardKey] = shouldGive;
    }
    var comboBonus = G.earned;
    var totalReward = coinDelta + comboBonus;
    save.coins += totalReward;
    if(stars > oldStars) save.totalScore += (stars - oldStars) * 10;

    var unit = G.unit;
    var allDone = true;
    for(var i=0;i<unit.levels.length;i++){
      var lv = unit.levels[i];
      var k = lv.isBoss ? 'boss' : i;
      if(save.stars[pid] === undefined || save.stars[pid][k] === undefined){ allDone = false; break; }
    }
    var planetCleared = false;
    if(allDone && save.cleared.indexOf(pid) === -1){
      save.cleared.push(pid); planetCleared = true;
      if(save.badges.indexOf('clear'+pid) === -1) save.badges.push('clear'+pid);
    }
    if(stars === 3){
      save.streak = (save.streak||0) + 1;
      if(save.streak >= 3 && save.badges.indexOf('streak3') === -1){
        save.badges.push('streak3');
        showToast('🏅 徽章：连续三星达人！', 3000);
      }
    } else { save.streak = 0; }
    save.maxStreak = Math.max(save.maxStreak||0, save.streak||0);
    persist();

    var starsEl = $('result-stars');
    if(starsEl){
      starsEl.innerHTML = '';
      for(var i2=0;i2<3;i2++){
        var s = document.createElement('span');
        s.className = 'result-star';
        s.textContent = i2 < stars ? '⭐' : '☆';
        starsEl.appendChild(s);
      }
    }
    safeText($('result-title'), stars===3 ? '完美通关！' : (stars===2 ? '很棒！' : '继续加油！'));
    safeText($('result-sub'), planetCleared ? '🎉 新星球已解锁！' : ('本关答对 ' + (total - wrong) + '/' + total + ' 题'));
    var list = $('reward-list');
    if(list){
      list.innerHTML = '';
      var items = [['<span class="coin-icon"></span> 金币', '+' + totalReward]];
      if(comboBonus > 0) items.push(['🔥 连击奖励', '+' + comboBonus]);
      if(coinDelta > 0) items.push(['⭐ 首次通关奖励', '+' + coinDelta]);
      if(coinDelta === 0 && stars <= oldStars) items.push(['ℹ️ 本关奖励已领取', '0']);
      if(G.maxCombo >= 3) items.push(['🔥 最高连击', 'x' + G.maxCombo]);
      for(var ii=0; ii<items.length; ii++){
        var d = document.createElement('div');
        d.className = 'reward-item';
        d.innerHTML = '<span>'+items[ii][0]+'</span><span class="reward-val">'+items[ii][1]+'</span>';
        list.appendChild(d);
      }
    }
    showScreen('s-result');
    if(stars===3){
      sfxBadge();
      for(var fi=0;fi<6;fi++){
        (function(idx){
          setTimeout(function(){
            sparkle(Math.random()*W, Math.random()*H*0.6, '#fbbf24', 34);
          }, idx*150);
        })(fi);
      }
    } else sfxLevelUp();
  }catch(e){ showFatalError('endLevel: ' + e.message); }
}

function startBoss(){
  try{
    var u = G.unit;
    G.bossBase = u.boss;
    G.qs = randomizeLevel(u.levels[G.levelIdx].qs.slice());
    G.qIdx = 0;
    G.bossMaxHp = u.boss.hp;
    G.bossHp = u.boss.hp;
    G.bossTime = u.boss.time;
    G.bossCorrect = 0; G.bossWrong = 0; G.bossTotal = G.qs.length;
    G.bossLocked = false;
    initBossScreen(u.boss, false);
    showScreen('s-boss');
    startBossTimer();
    renderBossQuestion();
  }catch(e){ showFatalError('startBoss: ' + e.message); }
}
function startFinalBoss(){
  try{
    G.bossBase = FINAL_LEVEL;
    G.qs = randomizeLevel(FINAL_LEVEL.qs);
    G.qIdx = 0;
    G.bossMaxHp = FINAL_LEVEL.hp;
    G.bossHp = FINAL_LEVEL.hp;
    G.bossTime = FINAL_LEVEL.time;
    G.bossCorrect = 0; G.bossWrong = 0; G.bossTotal = G.qs.length;
    G.bossLocked = false;
    if(save.owned.indexOf('time15') !== -1) G.bossTime += 15;
    if(save.owned.indexOf('time30') !== -1) G.bossTime += 30;
    initBossScreen(FINAL_LEVEL, true);
    showScreen('s-boss');
    startBossTimer();
    renderBossQuestion();
  }catch(e){ showFatalError('startFinalBoss: ' + e.message); }
}
function initBossScreen(boss, isFinal){
  safeText($('boss-avatar'), boss.icon);
  safeText($('boss-name'), boss.name);
  safeText($('boss-timer'), G.bossTime);
  var t = $('boss-timer'); if(t) t.classList.remove('warn');
  updateBossHp();
  var p = $('boss-progress'); if(p) p.style.width = '0%';
  var bg = $('s-boss');
  if(bg){
    bg.style.background = isFinal
      ? 'radial-gradient(circle at 50% 30%, rgba(140,20,40,.75), rgba(15,4,20,1) 70%)'
      : 'radial-gradient(circle at 50% 30%, rgba(70,20,100,.65), rgba(8,10,26,1) 70%)';
  }
}
function updateBossHp(){
  var pct = G.bossMaxHp > 0 ? Math.max(0, G.bossHp / G.bossMaxHp * 100) : 0;
  var f = $('boss-hp-fill'); if(f) f.style.width = pct + '%';
  safeText($('boss-hp-text'), 'HP ' + Math.max(0,G.bossHp) + ' / ' + G.bossMaxHp);
}
function startBossTimer(){
  stopBossTimer();
  G.bossTimerHandle = setInterval(function(){
    G.bossTime--;
    if(G.bossTime <= 0){
      G.bossTime = 0;
      safeText($('boss-timer'), '0');
      stopBossTimer(); endBoss(false); return;
    }
    safeText($('boss-timer'), G.bossTime);
    var t = $('boss-timer');
    if(t){ if(G.bossTime <= 10) t.classList.add('warn'); else t.classList.remove('warn'); }
    try{
      checkDaily();
      if(save.daily) save.daily.seconds += 1;
      if(save.daily && save.daily.seconds >= 1200 && !save.daily.warned){
        save.daily.warned = true;
        showToast('今天已经玩了 20 分钟啦，休息一下眼睛吧～', 4000);
      }
    }catch(e){}
  }, 1000);
}
function stopBossTimer(){ if(G.bossTimerHandle){ clearInterval(G.bossTimerHandle); G.bossTimerHandle = null; } }
function renderBossQuestion(){
  try{
    var q = G.qs[G.qIdx];
    if(!q || G.bossHp <= 0 || G.bossTime <= 0){ endBoss(G.bossHp <= 0); return; }
    var qEl = $('boss-q');
    if(!qEl) return;
    if(q.t === 'order'){ qEl.textContent = '⚔️ 连词成句：' + (q.hint || ''); }
    else if(q.t === 'fill'){ qEl.innerHTML = '⚔️ ' + q.q.replace('___','<span class="q-blank">?</span>'); }
    else { qEl.textContent = '⚔️ ' + (q.q || q.hint || ''); }
    var optBox = $('boss-options');
    if(!optBox) return;
    optBox.innerHTML = '';
    var opts, correct, explain;
    if(q.t === 'order'){
      var target = q.words.join(' ');
      var wrongs = [q.words.slice().reverse().join(' '), q.words.slice(1).join(' ') + ' ' + q.words[0], q.words.slice(0, -1).join(' ')];
      var w2 = [];
      for(var wi=0; wi<wrongs.length; wi++){ if(wrongs[wi] !== target && w2.indexOf(wrongs[wi]) === -1) w2.push(wrongs[wi]); }
      if(w2.length < 2) w2.push('The ' + q.words[0], 'Yes ' + q.words[0]);
      opts = [target, w2[0], w2[1]];
      opts = shuffleArray(opts);
      correct = opts.indexOf(target); if(correct === -1) correct = 0;
      explain = target;
    } else {
      opts = q.o.slice(); correct = q.a; explain = q.e;
    }
    for(var oi=0; oi<opts.length; oi++){
      (function(idx){
        var b = document.createElement('button');
        b.className = 'boss-opt'; b.textContent = opts[idx];
        b.onclick = function(){ bossAnswer(b, idx, correct, explain, q); };
        optBox.appendChild(b);
      })(oi);
    }
    if(q.t === 'listen' && q.word){ unlockSpeech(); speakWithDelay(q.word); }
  }catch(e){ showFatalError('renderBossQuestion: ' + e.message); }
}
function bossAnswer(btn, idx, correct, explain, q){
  if(G.bossLocked) return;
  G.bossLocked = true;
  var all = document.querySelectorAll('#boss-options .boss-opt');
  for(var i=0;i<all.length;i++) all[i].disabled = true;
  if(idx === correct){
    btn.classList.add('correct');
    G.bossCorrect++;
    var dmg = 10;
    if(save.owned.indexOf('hammer') !== -1) dmg += 10;
    if(save.owned.indexOf('bomb') !== -1) dmg += 25;
    if(save.owned.indexOf('lightning') !== -1) dmg += 40;
    if(save.owned.indexOf('laser') !== -1) dmg += 60;
    G.bossHp -= dmg;
    if(G.bossHp < 0) G.bossHp = 0;
    sfxHit(G.bossBase.sound);
    var av = $('boss-avatar');
    if(av){
      var rect = av.getBoundingClientRect();
      var cx = rect.left + rect.width/2;
      var cy = rect.top + rect.height/2;
      explode(cx, cy, '#fbbf24', 60);
      explode(cx, cy, '#ef4444', 40);
      explode(cx + (Math.random()-0.5)*50, cy + (Math.random()-0.5)*50, '#ec4899', 30);
      showDamageNumber(cx, cy - 50, dmg);
      av.classList.remove('hit'); void av.offsetWidth; av.classList.add('hit');
    }
    if(dmg >= 50){ screenShake(3); screenFlash('white'); }
    else if(dmg >= 30){ screenShake(2); screenFlash('gold'); }
    else { screenShake(1); screenFlash('gold'); }
    updateBossHp();
    flyCoinToBoss();
    showFeedback('💥');
    setTimeout(function(){
      G.bossLocked = false;
      if(G.bossHp <= 0){ stopBossTimer(); endBoss(true); return; }
      G.qIdx++;
      if(G.qIdx >= G.qs.length){ stopBossTimer(); endBoss(G.bossHp <= G.bossMaxHp * 0.3); return; }
      renderBossQuestion();
    }, 900);
  } else {
    btn.classList.add('wrong');
    if(all[correct]) all[correct].classList.add('correct');
    G.bossWrong++;
    if(save.owned.indexOf('heart') === -1){
      G.bossTime = Math.max(0, G.bossTime - 3);
      safeText($('boss-timer'), G.bossTime);
    }
    showFeedback('❌'); sfxWrong();
    screenShake(2); screenFlash('red');
    setTimeout(function(){
      G.bossLocked = false;
      if(G.bossTime <= 0){ endBoss(false); return; }
      G.qIdx++;
      if(G.qIdx >= G.qs.length){ endBoss(G.bossHp <= G.bossMaxHp * 0.3); return; }
      renderBossQuestion();
    }, 1200);
  }
  var p = $('boss-progress');
  if(p) p.style.width = ((G.qIdx+1) / G.qs.length * 100) + '%';
}
function flyCoinToBoss(){
  var av = $('boss-avatar');
  if(!av) return;
  var rect = av.getBoundingClientRect();
  var endX = rect.left + rect.width/2;
  var endY = rect.top + rect.height/2;
  var startX = W/2; var startY = H*0.85;
  var coin = document.createElement('div');
  coin.style.cssText = 'position:fixed;width:80px;height:80px;border-radius:50%;pointer-events:none;z-index:60;' +
    'left:' + startX + 'px;top:' + startY + 'px;transform:translate(-50%,-50%);' +
    'background:radial-gradient(circle at 30% 30%,#fef3c7,#fbbf24 50%,#d97706 100%);' +
    'border:6px solid #92400e;box-shadow:0 0 40px #fbbf24,0 0 80px #f59e0b,inset 0 6px 14px rgba(255,255,255,.7);';
  var inner = document.createElement('div');
  inner.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);' +
    'width:36px;height:36px;border-radius:50%;' +
    'background:radial-gradient(circle,#fef9c3,#f59e0b);border:3px solid #92400e;';
  coin.appendChild(inner);
  document.body.appendChild(coin);
  var t0 = performance.now();
  var dur = 620;
  function anim(t){
    var k = Math.min(1, (t - t0) / dur);
    var ease = k < 0.5 ? 2*k*k : -1+(4-2*k)*k;
    var x = startX + (endX - startX) * ease;
    var y = startY + (endY - startY) * ease - Math.sin(k*Math.PI) * 140;
    coin.style.left = x + 'px'; coin.style.top = y + 'px';
    var sc = 1 + Math.sin(k*Math.PI) * 1.1;
    coin.style.transform = 'translate(-50%,-50%) scale(' + sc + ') rotate(' + (k*1080) + 'deg)';
    if(Math.random() < 0.4) sparkle(x, y, '#fbbf24', 3);
    if(k < 1) requestAnimationFrame(anim);
    else { sfxCoin(); explode(endX, endY, '#fbbf24', 30); coin.remove(); }
  }
  requestAnimationFrame(anim);
}
/* 关键修复：判断整单元完成时，正确匹配 BOSS 的 'boss' 键 */
function endBoss(win){
  try{
    var totalQ = G.bossTotal;
    var correct = G.bossCorrect;
    var accuracy = totalQ > 0 ? correct / totalQ : 0;
    var stars = 0;
    if(win && accuracy >= 1) stars = 3;
    else if(win && accuracy >= 0.85) stars = 2;
    else if(win) stars = 1;
    if(win && save.owned.indexOf('star') !== -1 && stars < 3) stars += 1;
    var pid = G.isFinal ? 'final' : ('u' + G.unit.id);
    var key = G.isFinal ? 0 : 'boss';
    if(!save.stars[pid]) save.stars[pid] = {};
    var oldStars = save.stars[pid][key] || 0;
    if(stars > oldStars) save.stars[pid][key] = stars;
    var reward = 0;
    if(stars === 3) reward = 20;
    else if(stars === 2) reward = 12;
    else if(stars === 1) reward = 6;
    var rewardKey = pid + '_B';
    if(!save.levelRewarded) save.levelRewarded = {};
    var alreadyGiven = save.levelRewarded[rewardKey] || 0;
    var coinDelta = 0;
    if(stars > oldStars){
      coinDelta = reward - alreadyGiven;
      if(coinDelta < 0) coinDelta = 0;
      save.levelRewarded[rewardKey] = reward;
    }
    if(win){ save.coins += coinDelta; save.totalScore += Math.max(0, (stars - oldStars)) * 20; }
    if(G.isFinal && win && save.cleared.indexOf('final') === -1){
      save.cleared.push('final');
      if(save.badges.indexOf('final') === -1) save.badges.push('final');
    }
    /* 关键修复：用 BOSS 的 'boss' 键来判断整单元是否完成 */
    if(!G.isFinal){
      var unit = G.unit;
      var allDone = true;
      for(var i=0;i<unit.levels.length;i++){
        var lv = unit.levels[i];
        var k = lv.isBoss ? 'boss' : i;
        if(save.stars['u'+unit.id] === undefined || save.stars['u'+unit.id][k] === undefined){ allDone = false; break; }
      }
      if(allDone && save.cleared.indexOf(pid) === -1){ save.cleared.push(pid); }
    }
    persist();
    var starsEl = $('result-stars');
    if(starsEl){
      starsEl.innerHTML = '';
      for(var s=0;s<3;s++){
        var sp = document.createElement('span');
        sp.className = 'result-star';
        sp.textContent = s < stars ? '⭐' : '☆';
        starsEl.appendChild(sp);
      }
    }
    safeText($('result-title'), win ? (stars===3?'完胜 BOSS！':'战胜 BOSS！') : 'BOSS 太强了');
    safeText($('result-sub'), '答对 ' + correct + '/' + totalQ + '，准确率 ' + Math.round(accuracy*100) + '%');
    var list = $('reward-list');
    if(list){
      list.innerHTML = '';
      var items = [['🎯 准确率', Math.round(accuracy*100) + '%']];
      if(coinDelta > 0) items.push(['<span class="coin-icon"></span> 金币奖励', '+' + coinDelta]);
      else if(win) items.push(['ℹ️ 本关奖励已领取', '0']);
      if(!win) items.push(['💡 提示', '再试一次可以赢']);
      for(var ii=0;ii<items.length;ii++){
        var d = document.createElement('div');
        d.className = 'reward-item';
        d.innerHTML = '<span>'+items[ii][0]+'</span><span class="reward-val">'+items[ii][1]+'</span>';
        list.appendChild(d);
      }
    }
    showScreen('s-result');
    if(win){
      sfxBossWin();
      for(var fi=0;fi<10;fi++){
        (function(idx){
          setTimeout(function(){
            sparkle(Math.random()*W, Math.random()*H*0.5, '#fbbf24', 44);
          }, idx*120);
        })(fi);
      }
    } else { sfxBossLose(); screenShake(3); screenFlash('red'); }
  }catch(e){ showFatalError('endBoss: ' + e.message); }
}

function renderShop(){
  try{
    safeText($('shop-coins'), save.coins);
    var body = $('shop-body');
    if(!body) return;
    body.innerHTML = '';
    var sec = document.createElement('div');
    sec.className = 'shop-section';
    sec.innerHTML = '<h3>🛠️ 工具与道具</h3>';
    var grid = document.createElement('div');
    grid.className = 'shop-grid';
    for(var si=0; si<SHOP_ITEMS.length; si++){
      (function(it){
        var owned = save.owned.indexOf(it.id) !== -1;
        var div = document.createElement('div');
        div.className = 'shop-item' + (owned?' owned':'');
        div.innerHTML = '<div class="icon">' + it.icon + '</div>' +
          '<div class="name">' + it.name + '</div>' +
          '<div class="price">' + (owned ? '已拥有' : '<span class="coin-icon"></span> ' + it.price) + '</div>' +
          (owned ? '<div class="own-tag">✔ 已购买</div>' : '');
        if(!owned){
          div.onclick = function(){
            if(save.coins < it.price){ showToast('金币不足，去挑战 BOSS 赚金币吧！'); return; }
            save.coins -= it.price;
            save.owned.push(it.id);
            persist();
            sfxCoin();
            sparkle(W/2, H/2, '#fbbf24', 28);
            showToast('购买成功：' + it.name);
            renderShop();
          };
        }
        grid.appendChild(div);
      })(SHOP_ITEMS[si]);
    }
    sec.appendChild(grid);
    body.appendChild(sec);
  }catch(e){ showFatalError('renderShop: ' + e.message); }
}

function bindEvents(){
  function bind(id, fn){ var el = $(id); if(el) el.onclick = fn; }
  bind('btn-start', function(){ initAudio(); unlockSpeech(); sfxClick(); showScreen('s-map'); renderMap(); });
  bind('btn-continue-game', function(){ initAudio(); unlockSpeech(); sfxClick(); resumeGame(); });
  bind('btn-home', function(){ sfxClick(); renderHome(); showScreen('s-home'); });
  bind('btn-shop', function(){ sfxClick(); renderShop(); showScreen('s-shop'); });
  bind('btn-shop-back', function(){ sfxClick(); renderHome(); showScreen('s-home'); });
  bind('btn-reset', function(){
    sfxClick();
    showModal('重置进度？','所有星星、金币、徽章都会清空，且无法恢复。', function(){
      showModal('真的要重置吗？','这是最后确认，重置后无法撤销。', function(){
        try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
        document.cookie = COOKIE_KEY + '=;max-age=0;path=/';
        save = defaultSave(); checkDaily(); persist();
        renderHome(); showToast('进度已重置');
      }, '确认重置', '我再想想');
    }, '重置', '取消');
  });
  bind('btn-quit', function(){
    sfxClick();
    showModal('退出关卡？','当前进度会保存。', function(){
      stopTimer(); persist(); renderHome(); showScreen('s-home');
    }, '退出', '继续');
  });
  bind('btn-boss-quit', function(){
    sfxClick();
    showModal('退出 BOSS 战？','本关进度不会保留。', function(){
      stopBossTimer(); persist(); renderHome(); showScreen('s-home');
    }, '退出', '继续');
  });
  bind('btn-continue', function(){
    sfxClick();
    if(G.isFinal || (G.unit && G.levelIdx === -1)){ showScreen('s-map'); renderMap(); return; }
    var u = G.unit;
    var nextLv = G.levelIdx + 1;
    if(u && nextLv < u.levels.length){ startUnit(u, nextLv); }
    else { showScreen('s-map'); renderMap(); }
  });
}

function init(){
  try{
    bgCanvas = $('bgCanvas'); fxCanvas = $('fxCanvas');
    if(bgCanvas) bgCtx = bgCanvas.getContext('2d');
    if(fxCanvas) fxCtx = fxCanvas.getContext('2d');
    resizeAll();
    loadSave();
    renderHome();
    showScreen('s-home');
    bindEvents();
    window.addEventListener('resize', resizeAll);
    window.addEventListener('orientationchange', function(){ setTimeout(resizeAll, 300); });
    var unlockAll = function(){
      initAudio();
      if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      unlockSpeech();
      document.removeEventListener('touchstart', unlockAll);
      document.removeEventListener('mousedown', unlockAll);
      document.removeEventListener('click', unlockAll);
    };
    document.addEventListener('touchstart', unlockAll, {passive:true});
    document.addEventListener('mousedown', unlockAll);
    document.addEventListener('click', unlockAll);
    document.addEventListener('visibilitychange', persist);
    window.addEventListener('pagehide', persist);
    window.addEventListener('beforeunload', persist);
    window.addEventListener('blur', persist);
    window.addEventListener('freeze', persist);
    bgLoop(); fxLoop();
    setInterval(persist, 3000);
  }catch(e){ showFatalError('init: ' + e.message + '\n' + (e.stack||'')); }
}

if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', init); }
else { init(); }
</script>
