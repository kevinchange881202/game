<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e27">
<title>星际英语探险 · 四年级上册</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0e27;color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
user-select:none;-webkit-user-select:none;position:fixed;overscroll-behavior:none;
touch-action:manipulation}
#starfield{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#app{position:fixed;inset:0;z-index:1}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;
-webkit-overflow-scrolling:touch;
padding:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-right,0px) + 16px)
calc(env(safe-area-inset-bottom,0px) + 14px) calc(env(safe-area-inset-left,0px) + 16px)}
.screen.active{display:flex}
.big-btn{border:none;border-radius:20px;padding:20px 28px;font-size:22px;font-weight:700;
font-family:inherit;color:#fff;cursor:pointer;transition:transform .12s,box-shadow .2s;
box-shadow:0 6px 20px rgba(0,0,0,.35);min-height:64px;letter-spacing:1px}
.big-btn:active{transform:scale(.96)}
.big-btn.primary{background:linear-gradient(135deg,#3b82f6,#8b5cf6);
box-shadow:0 6px 24px rgba(99,102,241,.5)}
.big-btn.gold{background:linear-gradient(135deg,#f59e0b,#ef4444);
box-shadow:0 6px 24px rgba(245,158,11,.5)}
.big-btn.ghost{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);
box-shadow:none;font-size:17px;padding:14px 22px;min-height:52px}
.icon-btn{background:rgba(255,255,255,.12);border:none;border-radius:14px;color:#fff;
font-size:22px;width:52px;height:52px;cursor:pointer;display:flex;align-items:center;
justify-content:center;transition:transform .12s}
.icon-btn:active{transform:scale(.9)}
#s-home{align-items:center;justify-content:center;text-align:center;gap:8px}
.home-rocket{font-size:80px;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 8px 24px rgba(99,102,241,.6))}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.home-title{font-size:clamp(30px,7vw,52px);font-weight:900;letter-spacing:3px;
background:linear-gradient(135deg,#60a5fa,#a78bfa,#f472b6);-webkit-background-clip:text;
background-clip:text;-webkit-text-fill-color:transparent;margin-top:6px}
.home-sub{font-size:clamp(14px,3vw,18px);color:rgba(180,200,255,.7);letter-spacing:2px;margin-top:2px}
.home-stats{display:flex;gap:16px;margin:22px 0 8px;flex-wrap:wrap;justify-content:center}
.home-stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
border-radius:16px;padding:10px 20px;font-size:18px;font-weight:700;display:flex;
align-items:center;gap:8px;backdrop-filter:blur(8px)}
.home-btns{display:flex;flex-direction:column;gap:14px;margin-top:26px;width:min(340px,86vw)}
.home-hint{font-size:13px;color:rgba(150,170,220,.5);margin-top:18px;line-height:1.6}
#s-map{gap:12px}
.map-top{display:flex;align-items:center;gap:12px;justify-content:space-between}
.map-title{font-size:clamp(18px,4vw,24px);font-weight:800;letter-spacing:2px;
background:linear-gradient(135deg,#93c5fd,#c4b5fd);-webkit-background-clip:text;
background-clip:text;-webkit-text-fill-color:transparent}
.map-coins{background:rgba(255,255,255,.08);border-radius:14px;padding:8px 14px;
font-size:16px;font-weight:700;white-space:nowrap}
.planet-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;
padding-bottom:20px;flex:1}
.planet-card{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);
border-radius:22px;padding:18px 12px;text-align:center;cursor:pointer;
transition:transform .15s,box-shadow .2s,border-color .2s;position:relative;overflow:hidden;
display:flex;flex-direction:column;align-items:center;gap:6px;min-height:150px;justify-content:center}
.planet-card:active{transform:scale(.96)}
.planet-card.locked{opacity:.45;filter:grayscale(.6);pointer-events:none}
.planet-card.done{border-color:rgba(52,211,153,.6);
box-shadow:0 0 24px rgba(52,211,153,.25)}
.planet-card.current{border-color:rgba(96,165,250,.9);
box-shadow:0 0 28px rgba(96,165,250,.4);animation:pulseGlow 2s ease-in-out infinite}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 24px rgba(96,165,250,.35)}50%{box-shadow:0 0 40px rgba(96,165,250,.65)}}
.planet-icon{font-size:44px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4))}
.planet-name{font-size:16px;font-weight:800;letter-spacing:1px}
.planet-en{font-size:11px;color:rgba(180,200,255,.6);letter-spacing:1px}
.planet-stars{font-size:14px;letter-spacing:2px;margin-top:2px;min-height:20px}
.planet-badge{position:absolute;top:10px;right:10px;font-size:20px}
.planet-lock{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
font-size:36px;opacity:.7}
#s-quiz{gap:10px}
.quiz-top{display:flex;align-items:center;gap:12px}
.progress-track{flex:1;height:12px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#8b5cf6);
border-radius:6px;transition:width .35s cubic-bezier(.4,0,.2,1)}
.combo-badge{background:linear-gradient(135deg,#f59e0b,#ef4444);border-radius:12px;
padding:6px 12px;font-size:15px;font-weight:800;white-space:nowrap;min-width:44px;text-align:center;
box-shadow:0 0 16px rgba(245,158,11,.6);display:none}
.combo-badge.show{display:block;animation:comboPop .3s}
@keyframes comboPop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.quiz-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;
padding:10px 0}
.q-prompt{text-align:center;font-size:clamp(20px,4.5vw,30px);font-weight:800;line-height:1.45;
letter-spacing:.5px;padding:0 6px}
.q-hint{text-align:center;font-size:clamp(13px,2.8vw,17px);color:rgba(180,200,255,.65);margin-top:-8px}
.q-en{color:#93c5fd;font-size:clamp(22px,5vw,34px);font-weight:800;letter-spacing:1px;
line-height:1.4;text-align:center}
.q-blank{display:inline-block;min-width:60px;border-bottom:3px solid #60a5fa;
margin:0 6px;color:#fbbf24}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.16);
border-radius:18px;padding:20px 12px;font-size:clamp(17px,3.6vw,23px);font-weight:700;
color:#fff;font-family:inherit;cursor:pointer;transition:transform .12s,background .2s,border-color .2s;
min-height:70px;display:flex;align-items:center;justify-content:center;letter-spacing:.5px;
word-break:break-word}
.opt:active{transform:scale(.95)}
.opt.correct{background:rgba(34,197,94,.35);border-color:#22c55e;animation:correctPop .4s}
.opt.wrong{background:rgba(239,68,68,.3);border-color:#ef4444;animation:shake .4s}
.opt:disabled{pointer-events:none}
@keyframes correctPop{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.spell-area{display:flex;flex-direction:column;gap:18px;align-items:center}
.spell-slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:56px;
padding:10px;background:rgba(255,255,255,.05);border-radius:16px;border:2px dashed rgba(255,255,255,.18)}
.slot{width:46px;height:52px;border-radius:12px;background:rgba(96,165,250,.18);
border:2px solid rgba(96,165,250,.4);display:flex;align-items:center;justify-content:center;
font-size:24px;font-weight:800;color:#93c5fd;cursor:pointer;transition:transform .12s}
.slot:active{transform:scale(.9)}
.slot.filled{background:rgba(96,165,250,.35);border-color:#60a5fa;color:#fff}
.letter-pool{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.letter{width:52px;height:56px;border-radius:14px;background:rgba(255,255,255,.1);
border:2px solid rgba(255,255,255,.2);color:#fff;font-size:24px;font-weight:800;
font-family:inherit;cursor:pointer;transition:transform .12s;display:flex;align-items:center;
justify-content:center}
.letter:active{transform:scale(.9)}
.letter.used{opacity:.2;pointer-events:none}
.order-area{display:flex;flex-direction:column;gap:16px;align-items:center}
.order-zone{min-height:80px;width:100%;background:rgba(255,255,255,.05);border-radius:18px;
border:2px dashed rgba(255,255,255,.18);padding:14px;display:flex;flex-wrap:wrap;gap:8px;
justify-content:center;align-items:center}
.order-word{background:rgba(96,165,250,.3);border:2px solid rgba(96,165,250,.5);
border-radius:12px;padding:10px 16px;font-size:20px;font-weight:700;color:#fff;
cursor:pointer;font-family:inherit;transition:transform .12s}
.order-word:active{transform:scale(.93)}
.word-pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.word-pool .order-word{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22)}
.word-pool .order-word.used{opacity:.2;pointer-events:none}
.listen-btn{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#8b5cf6);
border:none;font-size:48px;cursor:pointer;box-shadow:0 8px 30px rgba(99,102,241,.55);
display:flex;align-items:center;justify-content:center;margin:0 auto;transition:transform .12s}
.listen-btn:active{transform:scale(.9)}
.listen-btn.playing{animation:listenPulse 1s ease-in-out infinite}
@keyframes listenPulse{0%,100%{box-shadow:0 8px 30px rgba(99,102,241,.55)}50%{box-shadow:0 8px 50px rgba(139,92,246,.9)}}
.feedback{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.6);
font-size:90px;opacity:0;pointer-events:none;z-index:50;transition:none}
.feedback.show{animation:fbPop .9s ease-out}
@keyframes fbPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
.coin-fly{position:fixed;font-size:32px;pointer-events:none;z-index:60;
animation:coinFly 1s ease-out forwards}
@keyframes coinFly{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-140px) scale(.4)}}
#s-result{align-items:center;justify-content:center}
.result-card{background:rgba(20,26,50,.85);border:1.5px solid rgba(255,255,255,.15);
border-radius:28px;padding:34px 26px;text-align:center;width:min(400px,90vw);
backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(0,0,0,.5);animation:cardIn .5s ease-out}
@keyframes cardIn{0%{opacity:0;transform:scale(.85) translateY(20px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.result-stars{font-size:60px;letter-spacing:10px;margin-bottom:10px;min-height:70px}
.result-star{display:inline-block;opacity:0;animation:starIn .5s ease-out forwards}
.result-star:nth-child(1){animation-delay:.15s}
.result-star:nth-child(2){animation-delay:.4s}
.result-star:nth-child(3){animation-delay:.65s}
@keyframes starIn{0%{opacity:0;transform:scale(0) rotate(-180deg)}70%{transform:scale(1.3) rotate(10deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.result-title{font-size:26px;font-weight:900;letter-spacing:3px;margin-bottom:6px;
background:linear-gradient(135deg,#fbbf24,#f472b6);-webkit-background-clip:text;
background-clip:text;-webkit-text-fill-color:transparent}
.result-sub{font-size:15px;color:rgba(180,200,255,.7);margin-bottom:20px}
.reward-list{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.reward-item{background:rgba(255,255,255,.06);border-radius:14px;padding:12px 18px;
font-size:17px;font-weight:700;display:flex;justify-content:space-between;align-items:center;
animation:rewardIn .4s ease-out backwards}
.reward-item:nth-child(1){animation-delay:.5s}
.reward-item:nth-child(2){animation-delay:.65s}
.reward-item:nth-child(3){animation-delay:.8s}
.reward-item:nth-child(4){animation-delay:.95s}
@keyframes rewardIn{0%{opacity:0;transform:translateX(-20px)}100%{opacity:1;transform:translateX(0)}}
.reward-val{color:#fbbf24;font-size:19px}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);left:50%;
transform:translateX(-50%) translateY(100px);background:rgba(30,40,70,.95);
border:1.5px solid rgba(96,165,250,.5);border-radius:18px;padding:16px 26px;
font-size:16px;font-weight:700;z-index:100;transition:transform .4s cubic-bezier(.4,0,.2,1);
backdrop-filter:blur(12px);max-width:88vw;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.toast.show{transform:translateX(-50%) translateY(0)}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;
align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.modal-mask.show{display:flex}
.modal-box{background:rgba(20,26,50,.97);border:1.5px solid rgba(255,255,255,.15);
border-radius:24px;padding:30px 24px;text-align:center;width:min(360px,88vw);
animation:cardIn .3s ease-out}
.modal-box h3{font-size:20px;margin-bottom:12px;font-weight:800}
.modal-box p{font-size:15px;color:rgba(180,200,255,.75);line-height:1.6;margin-bottom:22px}
.modal-btns{display:flex;gap:12px}
.modal-btns .big-btn{flex:1;font-size:17px;padding:14px;min-height:52px}
@media (max-height:600px){
  .home-rocket{font-size:56px}
  .planet-card{min-height:120px;padding:12px 8px}
  .planet-icon{font-size:34px}
  .slot,.letter{width:42px;height:46px;font-size:20px}
  .listen-btn{width:90px;height:90px;font-size:38px}
}
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<div id="app">
  <div class="screen active" id="s-home">
    <div class="home-rocket">🚀</div>
    <h1 class="home-title">星际英语探险</h1>
    <p class="home-sub">四年级上册 · 译林版</p>
    <div class="home-stats">
      <div class="home-stat">⭐ <span id="home-stars">0</span></div>
      <div class="home-stat">🪙 <span id="home-coins">0</span></div>
      <div class="home-stat">🏅 <span id="home-badges">0</span></div>
    </div>
    <div class="home-btns">
      <button class="big-btn primary" id="btn-start">开始探险</button>
      <button class="big-btn ghost" id="btn-reset">重置进度</button>
    </div>
    <p class="home-hint">每天玩 20 分钟，轻松学英语<br>进度自动保存，随时继续</p>
  </div>
  <div class="screen" id="s-map">
    <div class="map-top">
      <button class="icon-btn" id="btn-home">←</button>
      <div class="map-title">选择星球</div>
      <div class="map-coins">🪙 <span id="map-coins">0</span></div>
    </div>
    <div class="planet-grid" id="planet-grid"></div>
  </div>
  <div class="screen" id="s-quiz">
    <div class="quiz-top">
      <button class="icon-btn" id="btn-quit">×</button>
      <div class="progress-track"><div class="progress-fill" id="q-progress"></div></div>
      <div class="combo-badge" id="q-combo">x0</div>
    </div>
    <div class="quiz-body" id="quiz-body"></div>
  </div>
  <div class="screen" id="s-result">
    <div class="result-card">
      <div class="result-stars" id="result-stars"></div>
      <div class="result-title" id="result-title">关卡完成</div>
      <div class="result-sub" id="result-sub"></div>
      <div class="reward-list" id="reward-list"></div>
      <button class="big-btn primary" id="btn-continue" style="width:100%">继续</button>
    </div>
  </div>
</div>
<div class="feedback" id="feedback"></div>
<div class="toast" id="toast"></div>
<div class="modal-mask" id="modal-mask">
  <div class="modal-box">
    <h3 id="modal-title">提示</h3>
    <p id="modal-desc"></p>
    <div class="modal-btns">
      <button class="big-btn ghost" id="modal-cancel">取消</button>
      <button class="big-btn primary" id="modal-ok">确定</button>
    </div>
  </div>
</div>

var SAVE_KEY = 'star_english_save_v1';
var save = null;

function defaultSave(){
  return {
    version:1,
    muted:false,
    totalScore:0,
    coins:{gold:0,silver:0,bronze:0},
    badges:[],
    stars:{},
    cleared:[],
    currentPlanet:1,
    wrongBook:[],
    daily:{date:'',seconds:0,warned:false},
    streak:0,
    maxStreak:0
  };
}

function loadSave(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      var s = JSON.parse(raw);
      var d = defaultSave();
      save = Object.assign(d, s);
      save.coins = Object.assign(d.coins, s.coins || {});
      save.daily = Object.assign(d.daily, s.daily || {});
      checkDaily();
      return;
    }
  }catch(e){}
  save = defaultSave();
  checkDaily();
}

function persist(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){}
}

function checkDaily(){
  var today = new Date().toDateString();
  if(save.daily.date !== today){
    save.daily = {date:today, seconds:0, warned:false};
    persist();
  }
}

function totalStars(){
  var n = 0;
  for(var k in save.stars){
    for(var l in save.stars[k]) n += save.stars[k][l];
  }
  return n;
}

function totalCoins(){
  return save.coins.gold + save.coins.silver + save.coins.bronze;
}

var audioCtx = null;
var audioReady = false;

function initAudio(){
  if(audioReady) return;
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(AC){
      audioCtx = new AC();
      audioReady = true;
    }
  }catch(e){ audioCtx = null; }
}

function tone(freq, dur, type, vol, delay){
  if(!audioCtx || save.muted) return;
  try{
    var t0 = audioCtx.currentTime + (delay || 0);
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.07, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.05);
  }catch(e){}
}

function sfxClick(){ initAudio(); tone(560, 0.05, 'sine', 0.05); }
function sfxCorrect(){
  initAudio();
  tone(523, 0.1, 'sine', 0.08);
  tone(659, 0.1, 'sine', 0.08, 0.09);
  tone(784, 0.18, 'sine', 0.09, 0.18);
}
function sfxWrong(){
  initAudio();
  tone(300, 0.14, 'sine', 0.06);
  tone(220, 0.22, 'sine', 0.06, 0.12);
}
function sfxCoin(){
  initAudio();
  tone(1200, 0.06, 'sine', 0.05);
  tone(1600, 0.12, 'sine', 0.05, 0.05);
}
function sfxLevelUp(){
  initAudio();
  var notes = [523,659,784,1047];
  notes.forEach(function(f,i){ tone(f, 0.16, 'triangle', 0.08, i*0.1); });
}
function sfxBadge(){
  initAudio();
  var notes = [784,988,1175,1568];
  notes.forEach(function(f,i){ tone(f, 0.2, 'triangle', 0.09, i*0.12); });
}

function speak(text){
  if(save.muted) return;
  if(!('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.85;
    u.pitch = 1.1;
    u.volume = 0.9;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

var stars = [], shoots = [];

function resizeCanvas(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  initStars();
}

function initStars(){
  stars = [];
  var n = Math.min(Math.floor(W*H/16000), 120);
  for(var i=0;i<n;i++){
    stars.push({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*1.6+0.3,
      a:Math.random()*0.7+0.2,
      p:Math.random()*Math.PI*2,
      s:Math.random()*1.5+0.4
    });
  }
  shoots = [];
}

var lastShoot = 0;
function drawStars(t){
  ctx.clearRect(0,0,W,H);
  var g = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.5, Math.max(W,H)*0.9);
  g.addColorStop(0,'#141b3d');
  g.addColorStop(0.5,'#0c1128');
  g.addColorStop(1,'#05070f');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  for(var i=0;i<stars.length;i++){
    var s = stars[i];
    var a = s.a * (0.55 + 0.45*Math.sin(t*s.s + s.p));
    ctx.globalAlpha = a;
    ctx.fillStyle = '#c7d6ff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  if(t - lastShoot > 4500 && Math.random() < 0.02){
    lastShoot = t;
    shoots.push({
      x: Math.random()*W*0.7 + W*0.15,
      y: -30,
      vx: (Math.random()*0.5+0.6) * 3.5,
      vy: (Math.random()*0.3+0.5) * 3.5,
      life: 1
    });
  }
  for(var j=shoots.length-1;j>=0;j--){
    var sh = shoots[j];
    sh.x += sh.vx; sh.y += sh.vy; sh.life -= 0.012;
    if(sh.life <= 0 || sh.y > H+50){ shoots.splice(j,1); continue; }
    ctx.globalAlpha = sh.life * 0.9;
    var grad = ctx.createLinearGradient(sh.x, sh.y, sh.x - sh.vx*10, sh.y - sh.vy*10);
    grad.addColorStop(0,'#ffffff');
    grad.addColorStop(1,'rgba(255,255,255,0)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(sh.x, sh.y);
    ctx.lineTo(sh.x - sh.vx*10, sh.y - sh.vy*10);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

var bgT = 0;
function bgLoop(){
  bgT += 1;
  drawStars(bgT);
  requestAnimationFrame(bgLoop);
}

var screens = {
  home: document.getElementById('s-home'),
  map: document.getElementById('s-map'),
  quiz: document.getElementById('s-quiz'),
  result: document.getElementById('s-result')
};

function showScreen(name){
  for(var k in screens){
    screens[k].classList.toggle('active', k === name);
  }
}

var toastTimer = null;
function showToast(msg, dur){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, dur || 2600);
}

function showModal(title, desc, onOk, okText, cancelText){
  var mask = document.getElementById('modal-mask');
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-desc').textContent = desc;
  var okBtn = document.getElementById('modal-ok');
  var cancelBtn = document.getElementById('modal-cancel');
  okBtn.textContent = okText || '确定';
  cancelBtn.textContent = cancelText || '取消';
  mask.classList.add('show');
  var close = function(){ mask.classList.remove('show'); okBtn.onclick = null; cancelBtn.onclick = null; };
  okBtn.onclick = function(){ close(); if(onOk) onOk(); };
  cancelBtn.onclick = function(){ close(); };
}

function renderHome(){
  document.getElementById('home-stars').textContent = totalStars();
  document.getElementById('home-coins').textContent = totalCoins();
  document.getElementById('home-badges').textContent = save.badges.length;
}

function renderMap(){
  document.getElementById('map-coins').textContent = totalCoins();
  var grid = document.getElementById('planet-grid');
  grid.innerHTML = '';

  UNITS.forEach(function(u){
    var cleared = save.cleared.indexOf(u.id) !== -1;
    var unlocked = u.id === 1 || save.cleared.indexOf(u.id - 1) !== -1 || cleared;
    var isCurrent = save.currentPlanet === u.id && unlocked && !cleared;
    var card = document.createElement('div');
    card.className = 'planet-card' + (unlocked ? '' : ' locked') + (cleared ? ' done' : '') + (isCurrent ? ' current' : '');
    var starsArr = save.stars[u.id] || {};
    var starStr = '';
    for(var i=0;i<3;i++){
      starStr += starsArr[i] === 3 ? '⭐' : (starsArr[i] !== undefined ? '★' : '☆');
    }
    card.innerHTML =
      (cleared ? '<div class="planet-badge">✅</div>' : '') +
      '<div class="planet-icon">' + (unlocked ? u.icon : '🔒') + '</div>' +
      '<div class="planet-name">' + u.name + '</div>' +
      '<div class="planet-en">' + u.en + '</div>' +
      '<div class="planet-stars">' + (unlocked ? starStr : '') + '</div>' +
      (!unlocked ? '<div class="planet-lock">🔒</div>' : '');
    if(unlocked){
      card.addEventListener('click', (function(uu){ return function(){ sfxClick(); startPlanet(uu); }; })(u));
    }
    grid.appendChild(card);
  });

  var allCleared = UNITS.every(function(u){ return save.cleared.indexOf(u.id) !== -1; });
  var finalCard = document.createElement('div');
  finalCard.className = 'planet-card' + (allCleared ? '' : ' locked');
  var finalStars = save.stars['final'] || {};
  var fStr = '';
  for(var i=0;i<3;i++){
    fStr += finalStars[i] === 3 ? '⭐' : (finalStars[i] !== undefined ? '★' : '☆');
  }
  finalCard.innerHTML =
    '<div class="planet-icon">' + (allCleared ? '🌟' : '🔒') + '</div>' +
    '<div class="planet-name">终极挑战</div>' +
    '<div class="planet-en">Final Star</div>' +
    '<div class="planet-stars">' + (allCleared ? fStr : '') + '</div>' +
    (!allCleared ? '<div class="planet-lock">🔒</div>' : '');
  if(allCleared){
    finalCard.addEventListener('click', function(){ sfxClick(); startFinal(); });
  }
  grid.appendChild(finalCard);
}

var G = {
  unit: null,
  levelIdx: 0,
  qs: [],
  qIdx: 0,
  wrongCount: 0,
  combo: 0,
  maxCombo: 0,
  earned: {gold:0,silver:0,bronze:0},
  locked: false,
  isFinal: false,
  startTime: 0,
  timerHandle: null
};

function startPlanet(unit){
  G.unit = unit;
  G.isFinal = false;
  G.levelIdx = 0;
  startLevel();
}

function startFinal(){
  G.unit = null;
  G.isFinal = true;
  G.levelIdx = 0;
  G.qs = FINAL_LEVEL.qs.slice();
  G.qIdx = 0;
  G.wrongCount = 0;
  G.combo = 0;
  G.maxCombo = 0;
  G.earned = {gold:0,silver:0,bronze:0};
  G.locked = false;
  save.currentPlanet = 'final';
  persist();
  showScreen('quiz');
  renderQuestion();
  startTimer();
}

function startLevel(){
  var unit = G.unit;
  var lv = unit.levels[G.levelIdx];
  G.qs = lv.qs.slice();
  G.qIdx = 0;
  G.wrongCount = 0;
  G.combo = 0;
  G.maxCombo = 0;
  G.earned = {gold:0,silver:0,bronze:0};
  G.locked = false;
  save.currentPlanet = unit.id;
  persist();
  showScreen('quiz');
  renderQuestion();
  startTimer();
}

function startTimer(){
  stopTimer();
  G.timerHandle = setInterval(function(){
    checkDaily();
    save.daily.seconds += 5;
    if(save.daily.seconds >= 1200 && !save.daily.warned){
      save.daily.warned = true;
      showToast('今天已经玩了20分钟啦，休息一下眼睛吧～', 4000);
    }
    persist();
  }, 5000);
}
function stopTimer(){
  if(G.timerHandle){ clearInterval(G.timerHandle); G.timerHandle = null; }
}

var quizBody = document.getElementById('quiz-body');
var feedbackEl = document.getElementById('feedback');
var comboEl = document.getElementById('q-combo');

function updateProgress(){
  var total = G.qs.length;
  var pct = (G.qIdx / total) * 100;
  document.getElementById('q-progress').style.width = pct + '%';
}

function updateCombo(){
  if(G.combo >= 2){
    comboEl.textContent = 'x' + G.combo;
    comboEl.classList.add('show');
    comboEl.style.animation = 'none';
    void comboEl.offsetWidth;
    comboEl.style.animation = 'comboPop .3s';
  } else {
    comboEl.classList.remove('show');
  }
}

function renderQuestion(){
  updateProgress();
  updateCombo();
  var q = G.qs[G.qIdx];
  if(!q) return;
  quizBody.innerHTML = '';

  if(q.t === 'choice'){ renderChoice(q); }
  else if(q.t === 'listen'){ renderListen(q); }
  else if(q.t === 'spell'){ renderSpell(q); }
  else if(q.t === 'order'){ renderOrder(q); }
  else if(q.t === 'fill'){ renderFill(q); }
}

function renderChoice(q){
  var prompt = document.createElement('div');
  prompt.className = 'q-prompt';
  prompt.textContent = q.q;
  quizBody.appendChild(prompt);

  var opts = document.createElement('div');
  opts.className = 'options';
  q.o.forEach(function(text, i){
    var b = document.createElement('button');
    b.className = 'opt';
    b.textContent = text;
    b.addEventListener('click', function(){ answerChoice(b, i, q.a, q.e); });
    opts.appendChild(b);
  });
  quizBody.appendChild(opts);
}

function renderListen(q){
  var prompt = document.createElement('div');
  prompt.className = 'q-prompt';
  prompt.textContent = q.q;
  quizBody.appendChild(prompt);

  var btn = document.createElement('button');
  btn.className = 'listen-btn';
  btn.textContent = '🔊';
  btn.addEventListener('click', function(){
    btn.classList.add('playing');
    setTimeout(function(){ btn.classList.remove('playing'); }, 900);
    speak(q.word);
  });
  quizBody.appendChild(btn);

  var opts = document.createElement('div');
  opts.className = 'options';
  q.o.forEach(function(text, i){
    var b = document.createElement('button');
    b.className = 'opt';
    b.textContent = text;
    b.addEventListener('click', function(){ answerChoice(b, i, q.a, q.e); });
    opts.appendChild(b);
  });
  quizBody.appendChild(opts);

  setTimeout(function(){ speak(q.word); }, 300);
}

function renderFill(q){
  var prompt = document.createElement('div');
  prompt.className = 'q-prompt';
  prompt.innerHTML = q.q.replace('___', '<span class="q-blank">?</span>');
  quizBody.appendChild(prompt);

  var opts = document.createElement('div');
  opts.className = 'options';
  q.o.forEach(function(text, i){
    var b = document.createElement('button');
    b.className = 'opt';
    b.textContent = text;
    b.addEventListener('click', function(){ answerChoice(b, i, q.a, q.e); });
    opts.appendChild(b);
  });
  quizBody.appendChild(opts);
}

function renderSpell(q){
  var hint = document.createElement('div');
  hint.className = 'q-prompt';
  hint.textContent = '拼写：' + q.hint;
  quizBody.appendChild(hint);

  var area = document.createElement('div');
  area.className = 'spell-area';

  var slots = document.createElement('div');
  slots.className = 'spell-slots';
  area.appendChild(slots);

  var pool = document.createElement('div');
  pool.className = 'letter-pool';
  area.appendChild(pool);

  quizBody.appendChild(area);

  var target = q.word.toUpperCase();
  var targetLen = target.length;
  var filled = new Array(targetLen).fill(null);

  var letters = target.split('');
  var extra = (q.extra || '').split('');
  var extraCount = Math.max(2, Math.min(3, Math.floor(targetLen/3)));
  var poolLetters = letters.concat(extra.slice(0, extraCount));
  for(var i=poolLetters.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp = poolLetters[i]; poolLetters[i] = poolLetters[j]; poolLetters[j] = tmp;
  }

  function renderSlots(){
    slots.innerHTML = '';
    for(var k=0;k<targetLen;k++){
      (function(idx){
        var s = document.createElement('div');
        s.className = 'slot' + (filled[idx] ? ' filled' : '');
        s.textContent = filled[idx] || '';
        if(filled[idx]){
          s.addEventListener('click', function(){
            var removed = filled[idx];
            filled[idx] = null;
            var poolBtns = pool.querySelectorAll('.letter');
            for(var m=0;m<poolBtns.length;m++){
              if(poolBtns[m].dataset.letter === removed && poolBtns[m].classList.contains('used')){
                poolBtns[m].classList.remove('used');
                break;
              }
            }
            renderSlots();
          });
        }
        slots.appendChild(s);
      })(k);
    }
  }

  poolLetters.forEach(function(ch, idx){
    var b = document.createElement('button');
    b.className = 'letter';
    b.textContent = ch;
    b.dataset.letter = ch;
    b.dataset.idx = idx;
    b.addEventListener('click', function(){
      if(b.classList.contains('used')) return;
      var emptyIdx = filled.indexOf(null);
      if(emptyIdx === -1) return;
      filled[emptyIdx] = ch;
      b.classList.add('used');
      renderSlots();
      if(filled.every(function(x){ return x !== null; })){
        var answer = filled.join('');
        setTimeout(function(){
          if(answer === target){
            sfxCorrect();
            showFeedback('✅');
            G.combo++;
            G.maxCombo = Math.max(G.maxCombo, G.combo);
            awardCoins(true);
            speak(q.word);
            setTimeout(nextQuestion, 900);
          } else {
            sfxWrong();
            showFeedback('❌');
            G.wrongCount++;
            G.combo = 0;
            updateCombo();
            recordWrong(q);
            setTimeout(function(){
              filled = new Array(targetLen).fill(null);
              var poolBtns = pool.querySelectorAll('.letter');
              for(var m=0;m<poolBtns.length;m++){ poolBtns[m].classList.remove('used'); }
              renderSlots();
              showToast('再试一次，你可以的！');
            }, 700);
          }
        }, 200);
      }
    });
    pool.appendChild(b);
  });

  renderSlots();
}

function renderOrder(q){
  var hint = document.createElement('div');
  hint.className = 'q-prompt';
  hint.textContent = '排序：' + q.hint;
  quizBody.appendChild(hint);

  var area = document.createElement('div');
  area.className = 'order-area';

  var zone = document.createElement('div');
  zone.className = 'order-zone';
  area.appendChild(zone);

  var pool = document.createElement('div');
  pool.className = 'word-pool';
  area.appendChild(pool);

  quizBody.appendChild(area);

  var correct = q.words.slice();
  var shuffled = q.words.slice();
  for(var i=shuffled.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = tmp;
  }
  if(shuffled.join(' ') === correct.join(' ') && shuffled.length > 1){
    var t2 = shuffled[0]; shuffled[0] = shuffled[1]; shuffled[1] = t2;
  }

  var picked = [];

  function renderZone(){
    zone.innerHTML = '';
    if(picked.length === 0){
      var ph = document.createElement('div');
      ph.style.cssText = 'color:rgba(180,200,255,.4);font-size:16px;padding:10px';
      ph.textContent = '点击下面的单词，按顺序排好';
      zone.appendChild(ph);
      return;
    }
    picked.forEach(function(w, idx){
      var b = document.createElement('button');
      b.className = 'order-word';
      b.textContent = w;
      b.addEventListener('click', function(){
        picked.splice(idx, 1);
        var poolBtns = pool.querySelectorAll('.order-word');
        for(var m=0;m<poolBtns.length;m++){
          if(poolBtns[m].textContent === w && poolBtns[m].classList.contains('used')){
            poolBtns[m].classList.remove('used');
            break;
          }
        }
        renderZone();
      });
      zone.appendChild(b);
    });
  }

  shuffled.forEach(function(w, idx){
    var b = document.createElement('button');
    b.className = 'order-word';
    b.textContent = w;
    b.dataset.idx = idx;
    b.addEventListener('click', function(){
      if(b.classList.contains('used')) return;
      picked.push(w);
      b.classList.add('used');
      renderZone();
      if(picked.length === correct.length){
        var answer = picked.join(' ');
        setTimeout(function(){
          if(answer === correct.join(' ')){
            sfxCorrect();
            showFeedback('✅');
            G.combo++;
            G.maxCombo = Math.max(G.maxCombo, G.combo);
            awardCoins(true);
            setTimeout(nextQuestion, 900);
          } else {
            sfxWrong();
            showFeedback('❌');
            G.wrongCount++;
            G.combo = 0;
            updateCombo();
            recordWrong(q);
            setTimeout(function(){
              picked = [];
              var poolBtns = pool.querySelectorAll('.order-word');
              for(var m=0;m<poolBtns.length;m++){ poolBtns[m].classList.remove('used'); }
              renderZone();
              showToast('顺序再想一想～');
            }, 700);
          }
        }, 200);
      }
    });
    pool.appendChild(b);
  });

  renderZone();
}

function answerChoice(btn, idx, correct, explain){
  if(G.locked) return;
  G.locked = true;
  var allBtns = quizBody.querySelectorAll('.opt');
  for(var i=0;i<allBtns.length;i++){ allBtns[i].disabled = true; }

  if(idx === correct){
    btn.classList.add('correct');
    sfxCorrect();
    showFeedback('✅');
    G.combo++;
    G.maxCombo = Math.max(G.maxCombo, G.combo);
    awardCoins(true);
    setTimeout(function(){
      G.locked = false;
      nextQuestion();
    }, 1000);
  } else {
    btn.classList.add('wrong');
    allBtns[correct].classList.add('correct');
    sfxWrong();
    showFeedback('❌');
    G.wrongCount++;
    G.combo = 0;
    updateCombo();
    var q = G.qs[G.qIdx];
    recordWrong(q);
    if(explain){
      showToast('正确答案：' + explain, 2200);
    }
    setTimeout(function(){
      G.locked = false;
      nextQuestion();
    }, 1600);
  }
}

function showFeedback(emoji){
  feedbackEl.textContent = emoji;
  feedbackEl.classList.remove('show');
  void feedbackEl.offsetWidth;
  feedbackEl.classList.add('show');
}

function awardCoins(isCorrect){
  if(!isCorrect) return;
  var bonus = G.combo >= 3 ? 2 : 1;
  G.earned.gold += 1 * bonus;
  if(G.combo >= 2) G.earned.silver += 1;
  if(G.combo >= 4) G.earned.bronze += 1;
  var coin = document.createElement('div');
  coin.className = 'coin-fly';
  coin.textContent = '🪙';
  coin.style.left = (Math.random()*60 + 20) + '%';
  coin.style.top = '45%';
  document.body.appendChild(coin);
  setTimeout(function(){ coin.remove(); }, 1000);
  sfxCoin();
}

function recordWrong(q){
  var item = {
    q: q.q || q.hint || '',
    a: q.e || '',
    t: Date.now()
  };
  save.wrongBook.push(item);
  if(save.wrongBook.length > 50){
    save.wrongBook = save.wrongBook.slice(-50);
  }
  persist();
}

function nextQuestion(){
  G.qIdx++;
  if(G.qIdx >= G.qs.length){
    endLevel();
  } else {
    renderQuestion();
  }
}

function endLevel(){
  stopTimer();
  var total = G.qs.length;
  var wrong = G.wrongCount;
  var stars = 0;
  if(wrong === 0) stars = 3;
  else if(wrong === 1) stars = 2;
  else stars = 1;

  var pid = G.isFinal ? 'final' : G.unit.id;
  var lidx = G.isFinal ? 0 : G.levelIdx;
  if(!save.stars[pid]) save.stars[pid] = {};
  var oldStars = save.stars[pid][lidx] || 0;
  if(stars > oldStars){
    save.stars[pid][lidx] = stars;
  }

  var reward = {gold:0, silver:0, bronze:0};
  if(stars === 3){ reward.gold = 3; reward.silver = 2; reward.bronze = 1; }
  else if(stars === 2){ reward.gold = 2; reward.silver = 1; reward.bronze = 1; }
  else { reward.gold = 1; reward.bronze = 2; }

  reward.gold += G.earned.gold;
  reward.silver += G.earned.silver;
  reward.bronze += G.earned.bronze;

  save.coins.gold += reward.gold;
  save.coins.silver += reward.silver;
  save.coins.bronze += reward.bronze;
  save.totalScore += stars * 10;

  if(stars === 3){
    save.streak = (save.streak || 0) + 1;
    if(save.streak >= 3 && save.badges.indexOf('streak3') === -1){
      save.badges.push('streak3');
      showToast('🏅 获得徽章：连续三星达人！', 3000);
    }
  } else {
    save.streak = 0;
  }
  save.maxStreak = Math.max(save.maxStreak || 0, save.streak || 0);

  var planetCleared = false;
  if(!G.isFinal){
    var unit = G.unit;
    var allDone = unit.levels.every(function(_, i){
      return save.stars[unit.id] && save.stars[unit.id][i] !== undefined;
    });
    if(allDone && save.cleared.indexOf(unit.id) === -1){
      save.cleared.push(unit.id);
      planetCleared = true;
      if(save.badges.indexOf('clear' + unit.id) === -1){
        save.badges.push('clear' + unit.id);
      }
    }
  } else {
    if(save.cleared.indexOf('final') === -1){
      save.cleared.push('final');
      if(save.badges.indexOf('final') === -1){
        save.badges.push('final');
      }
    }
  }

  persist();

  renderResult(stars, reward, planetCleared);
  showScreen('result');

  if(stars === 3) sfxBadge();
  else sfxLevelUp();
}

function renderResult(stars, reward, planetCleared){
  var starsEl = document.getElementById('result-stars');
  starsEl.innerHTML = '';
  for(var i=0;i<3;i++){
    var s = document.createElement('span');
    s.className = 'result-star';
    s.textContent = i < stars ? '⭐' : '☆';
    starsEl.appendChild(s);
  }

  var title = document.getElementById('result-title');
  if(stars === 3) title.textContent = '完美通关！';
  else if(stars === 2) title.textContent = '很棒！';
  else title.textContent = '继续加油！';

  var sub = document.getElementById('result-sub');
  if(planetCleared){
    sub.textContent = '🎉 新星球已解锁！';
  } else {
    sub.textContent = '本关答对 ' + (G.qs.length - G.wrongCount) + '/' + G.qs.length + ' 题';
  }

  var list = document.getElementById('reward-list');
  list.innerHTML = '';
  var items = [];
  if(reward.gold > 0) items.push(['🪙 金币', '+' + reward.gold]);
  if(reward.silver > 0) items.push(['🥈 银币', '+' + reward.silver]);
  if(reward.bronze > 0) items.push(['🥉 铜币', '+' + reward.bronze]);
  if(G.maxCombo >= 3) items.push(['🔥 最高连击', 'x' + G.maxCombo]);
  items.forEach(function(pair){
    var d = document.createElement('div');
    d.className = 'reward-item';
    d.innerHTML = '<span>' + pair[0] + '</span><span class="reward-val">' + pair[1] + '</span>';
    list.appendChild(d);
  });
}

document.getElementById('btn-continue').addEventListener('click', function(){
  sfxClick();
  if(G.isFinal){
    showScreen('map');
    renderMap();
    return;
  }
  var unit = G.unit;
  if(G.levelIdx + 1 < unit.levels.length){
    G.levelIdx++;
    startLevel();
  } else {
    showScreen('map');
    renderMap();
  }
});

document.getElementById('btn-start').addEventListener('click', function(){
  initAudio();
  sfxClick();
  showScreen('map');
  renderMap();
});

document.getElementById('btn-home').addEventListener('click', function(){
  sfxClick();
  renderHome();
  showScreen('home');
});

document.getElementById('btn-quit').addEventListener('click', function(){
  sfxClick();
  showModal('退出关卡？', '当前进度会保存，下次可以继续。', function(){
    stopTimer();
    persist();
    renderHome();
    showScreen('home');
  }, '退出', '继续玩');
});

document.getElementById('btn-reset').addEventListener('click', function(){
  sfxClick();
  showModal('重置进度？', '所有星星、金币、徽章都会清空，且无法恢复。', function(){
    showModal('真的要重置吗？', '这是最后确认，重置后无法撤销。', function(){
      localStorage.removeItem(SAVE_KEY);
      save = defaultSave();
      checkDaily();
      persist();
      renderHome();
      showToast('进度已重置');
    }, '确认重置', '我再想想');
  }, '重置', '取消');
});

function init(){
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(resizeCanvas, 300); });

  loadSave();
  renderHome();
  showScreen('home');

  var unlockAudio = function(){
    initAudio();
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    document.removeEventListener('touchstart', unlockAudio);
    document.removeEventListener('mousedown', unlockAudio);
  };
  document.addEventListener('touchstart', unlockAudio, {passive:true});
  document.addEventListener('mousedown', unlockAudio);

  document.addEventListener('visibilitychange', function(){
    if(document.hidden) persist();
  });
  window.addEventListener('pagehide', persist);
  window.addEventListener('beforeunload', persist);

  bgLoop();
  setInterval(persist, 10000);
}

init();

})();
</script>
</body>
</html>
