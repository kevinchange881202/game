<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#08061a">
<title>星际英语探险 · 陈思宇专供版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#08061a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;user-select:none;-webkit-user-select:none;position:fixed;top:0;left:0;right:0;bottom:0;overscroll-behavior:none;touch-action:manipulation}
#bgCanvas{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0}
#fxCanvas{position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;pointer-events:none}
#app{position:fixed;top:0;left:0;right:0;bottom:0;z-index:1}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-right,0px) + 22px) calc(env(safe-area-inset-bottom,0px) + 20px) calc(env(safe-area-inset-left,0px) + 22px)}
.screen.active{display:flex}
.coin-icon{display:inline-block;width:1.2em;height:1.2em;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fef3c7,#fbbf24 50%,#d97706 100%);border:0.12em solid #92400e;position:relative;vertical-align:-0.15em;margin:0 0.1em}
.coin-icon::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:0.45em;height:0.45em;border-radius:50%;background:radial-gradient(circle,#fef9c3,#f59e0b);border:0.05em solid #92400e}
.btn{border:none;border-radius:26px;font-family:inherit;font-weight:900;color:#fff;cursor:pointer;transition:transform .15s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden;letter-spacing:.8px;isolation:isolate}
.btn:active{transform:scale(.94)}
.btn-primary{background:linear-gradient(135deg,#6366f1 0%,#a855f7 50%,#ec4899 100%);padding:28px 40px;font-size:32px;min-height:90px;box-shadow:0 16px 40px rgba(168,85,247,.55),inset 0 3px 0 rgba(255,255,255,.45);text-shadow:0 3px 10px rgba(0,0,0,.5)}
.btn-ghost{background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.05));border:2px solid rgba(255,255,255,.28);padding:20px 30px;font-size:23px;min-height:72px;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.icon-btn{background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.07));border:2px solid rgba(255,255,255,.25);border-radius:22px;color:#fff;font-size:30px;width:72px;height:72px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s;box-shadow:0 6px 18px rgba(0,0,0,.4);font-weight:900}
.icon-btn:active{transform:scale(.86)}
#s-home{align-items:center;justify-content:center;text-align:center;position:relative}
.home-orbit{position:absolute;top:50%;left:50%;width:min(110vmin,600px);height:min(110vmin,600px);transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(168,85,247,.25),transparent 65%);animation:orbitPulse 5s ease-in-out infinite}
@keyframes orbitPulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.9}50%{transform:translate(-50%,-50%) scale(1.08);opacity:1}}
.home-orbit::before,.home-orbit::after{content:'';position:absolute;border-radius:50%;inset:0;border:2px solid transparent;border-top-color:rgba(99,102,241,.7);border-right-color:rgba(236,72,153,.4)}
.home-orbit::before{animation:spin 20s linear infinite}
.home-orbit::after{inset:14%;border-top-color:rgba(236,72,153,.7);border-left-color:rgba(99,102,241,.4);animation:spin 14s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.home-rocket{font-size:clamp(120px,26vw,180px);animation:float 3.5s ease-in-out infinite;filter:drop-shadow(0 20px 40px rgba(168,85,247,.85));position:relative;z-index:1;line-height:1}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-28px) rotate(4deg)}}
.home-title{font-size:clamp(48px,10vw,88px);font-weight:900;letter-spacing:6px;margin-top:18px;background:linear-gradient(135deg,#60a5fa 0%,#c084fc 20%,#f472b6 40%,#fbbf24 60%,#60a5fa 80%,#c084fc 100%);background-size:400% 400%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:gradientShift 8s ease infinite;position:relative;z-index:1}
@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.home-owner{font-size:clamp(24px,5vw,42px);font-weight:900;letter-spacing:4px;margin-top:8px;background:linear-gradient(135deg,#fbbf24,#f472b6,#a855f7);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:gradientShift 6s ease infinite;position:relative;z-index:1}
.home-sub{font-size:clamp(18px,3.8vw,26px);color:rgba(180,200,255,.85);letter-spacing:5px;margin-top:6px;position:relative;z-index:1;font-weight:700}
.home-stats{display:flex;gap:18px;margin:34px 0 8px;flex-wrap:wrap;justify-content:center;position:relative;z-index:1}
.home-stat{background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.05));border:2px solid rgba(255,255,255,.22);border-radius:24px;padding:18px 32px;font-size:26px;font-weight:900;display:flex;align-items:center;gap:10px;box-shadow:0 8px 26px rgba(0,0,0,.4);text-shadow:0 2px 8px rgba(0,0,0,.4)}
.home-btns{display:flex;flex-direction:column;gap:20px;margin-top:40px;width:min(460px,90vw);position:relative;z-index:1}
.home-hint{font-size:19px;color:rgba(160,180,230,.8);margin-top:30px;line-height:1.9;position:relative;z-index:1;font-weight:600}
.map-top{display:flex;align-items:center;gap:14px;justify-content:space-between;margin-bottom:26px}
.map-title{font-size:clamp(30px,6.5vw,44px);font-weight:900;letter-spacing:5px;background:linear-gradient(135deg,#93c5fd,#c4b5fd,#f0abfc,#93c5fd);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:gradientShift 6s ease infinite}
.map-coins{background:linear-gradient(135deg,rgba(251,191,36,.3),rgba(249,115,22,.3));border:2.5px solid rgba(251,191,36,.7);border-radius:24px;padding:16px 28px;font-size:30px;font-weight:900;white-space:nowrap;display:flex;align-items:center;gap:6px;color:#fbbf24;text-shadow:0 0 14px rgba(251,191,36,.9)}
.planet-grid{display:flex;flex-direction:column;gap:20px;padding-bottom:30px}
.planet-card{display:flex;flex-direction:row;align-items:center;gap:30px;background:linear-gradient(135deg,rgba(255,255,255,.1) 0%,rgba(255,255,255,.02) 50%,rgba(255,255,255,.07) 100%);border:3px solid rgba(255,255,255,.18);border-radius:36px;padding:32px 36px;text-align:left;cursor:pointer;transition:transform .25s;position:relative;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.45);min-height:230px}
.planet-card::after{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.16) 0%,transparent 100%);border-radius:36px 36px 0 0;pointer-events:none}
.planet-card:active{transform:scale(.97)}
.planet-card.locked{opacity:.55;filter:grayscale(.6);pointer-events:none}
.planet-card.done{border-color:rgba(52,211,153,.75);background:linear-gradient(135deg,rgba(52,211,153,.22) 0%,rgba(255,255,255,.02) 50%,rgba(52,211,153,.1) 100%);box-shadow:0 0 44px rgba(52,211,153,.4),0 14px 40px rgba(0,0,0,.45)}
.planet-card.current{border-color:rgba(96,165,250,.95);background:linear-gradient(135deg,rgba(96,165,250,.24) 0%,rgba(168,85,247,.12) 50%,rgba(236,72,153,.1) 100%);box-shadow:0 0 50px rgba(96,165,250,.5),0 14px 40px rgba(0,0,0,.45);animation:pulseGlow 2.4s ease-in-out infinite}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 36px rgba(96,165,250,.45),0 14px 40px rgba(0,0,0,.45)}50%{box-shadow:0 0 80px rgba(96,165,250,.85),0 14px 40px rgba(0,0,0,.45)}}
.planet-icon{width:220px;height:220px;min-width:220px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:120px;line-height:1;background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.75),transparent 48%),radial-gradient(circle at 72% 80%,rgba(168,85,247,.6),transparent 55%),linear-gradient(135deg,rgba(99,102,241,.55),rgba(168,85,247,.35));border:4px solid rgba(255,255,255,.45);box-shadow:0 18px 44px rgba(0,0,0,.5),0 0 60px rgba(168,85,247,.55);animation:iconFloat 3s ease-in-out infinite;position:relative;z-index:1;flex-shrink:0}
.planet-icon::before{content:'';position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,rgba(168,85,247,.55),transparent 72%);animation:auraPulse 2.2s ease-in-out infinite;pointer-events:none;z-index:-1}
@keyframes auraPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.25);opacity:1}}
@keyframes iconFloat{0%,100%{transform:translateY(0) scale(1) rotate(0)}50%{transform:translateY(-14px) scale(1.08) rotate(3deg)}}
.planet-card.locked .planet-icon{background:linear-gradient(135deg,rgba(60,60,80,.75),rgba(30,30,50,.65));border-color:rgba(120,120,140,.45);box-shadow:0 8px 24px rgba(0,0,0,.6);animation:none}
.planet-card.locked .planet-icon::before{background:radial-gradient(circle,rgba(120,120,140,.4),transparent 72%);animation:none}
.planet-info{flex:1;display:flex;flex-direction:column;gap:10px;position:relative;z-index:1}
.planet-name{font-size:48px;font-weight:900;letter-spacing:4px;text-shadow:0 3px 18px rgba(0,0,0,.7)}
.planet-en{font-size:24px;color:rgba(180,200,255,.8);letter-spacing:3px;font-weight:700;text-transform:uppercase}

.planet-stars{font-size:42px;margin-top:8px;display:inline-block;position:relative;line-height:1}
.planet-stars .star-bg{opacity:.22;display:inline-block;letter-spacing:8px}
.planet-stars .star-top{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;display:inline-block;letter-spacing:8px}

.planet-stars .star-on,
.planet-stars .star-off,
.planet-stars .star-half{
  display:inline-block;
  width:1em;
  height:1em;
  margin-right:.2em;
  vertical-align:middle;
  position:relative;
}
.planet-stars > span:last-child{margin-right:0}

.planet-stars .star-on,
.planet-stars .star-off,
.planet-stars .star-half .half-bg,
.planet-stars .star-half .half-top{
  -webkit-clip-path:polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  clip-path:polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  background-color:#fbbf24;
}
.planet-stars .star-off,
.planet-stars .star-half .half-bg{
  background-color:rgba(255,255,255,.22);
}
.planet-stars .star-half .half-bg{
  position:absolute;
  inset:0;
}
.planet-stars .star-half .half-clip{
  position:absolute;
  top:0;left:0;
  height:100%;
  overflow:hidden;
}
.planet-stars .star-half .half-top{
  position:absolute;
  top:0;left:0;
  width:1em;
  height:1em;
}

.planet-stars.rainbow > span.star-on::before{
  content:'';
  position:absolute;
  inset:0;
  background-image:linear-gradient(35deg,
    #ff3b3b 0%,
    #ff9d3b 12.5%,
    #ffee3b 25%,
    #4dff7a 37.5%,
    #3bd9ff 50%,
    #4b6bff 62.5%,
    #a64bff 75%,
    #ff3b9d 87.5%,
    #ff3b3b 100%);
  background-size:300% 100%;
  animation:rainbowFlow 2.2s linear infinite;
  pointer-events:none;
}
@keyframes rainbowFlow{
  0%   { background-position:   0% 50%; }
  100% { background-position: 150% 50%; }
}

.planet-card.perfect .planet-icon::before{
  content:'';
  position:absolute;
  inset:-16px;
  border-radius:50%;
  background:conic-gradient(from 0deg,
    #ff3b3b,#ff9d3b,#ffee3b,#4dff7a,#3bd9ff,#4b6bff,#a64bff,#ff3b9d,#ff3b3b);
  -webkit-mask:radial-gradient(circle, transparent 58%, #000 64%, #000 100%);
          mask:radial-gradient(circle, transparent 58%, #000 64%, #000 100%);
  animation:rainbowRingSpin 1.8s linear infinite;
  filter:blur(2px);
  opacity:.95;
  pointer-events:none;
  z-index:-1;
}
@keyframes rainbowRingSpin{ to{ transform:rotate(360deg); } }

.planet-card.perfect .planet-icon::after{
  content:'';
  position:absolute;
  inset:0;
  border-radius:50%;
  background:conic-gradient(from 0deg,
    rgba(255,59,59,.55),rgba(255,157,59,.55),rgba(255,238,59,.55),rgba(77,255,122,.55),
    rgba(59,217,255,.55),rgba(75,107,255,.55),rgba(166,75,255,.55),rgba(255,59,157,.55),rgba(255,59,59,.55));
  animation:rainbowRingSpin 1.8s linear infinite;
  pointer-events:none;
  filter:blur(8px);
  mix-blend-mode:screen;
  opacity:.65;
}

.planet-card.perfect.current{
  animation:rainbowCardGlow 1.6s linear infinite;
}
@keyframes rainbowCardGlow{
  0%   {box-shadow:0 0 60px rgba(255,59,59,.9),  0 14px 40px rgba(0,0,0,.45)}
  16%  {box-shadow:0 0 60px rgba(255,157,59,.9), 0 14px 40px rgba(0,0,0,.45)}
  33%  {box-shadow:0 0 60px rgba(255,238,59,.9), 0 14px 40px rgba(0,0,0,.45)}
  50%  {box-shadow:0 0 60px rgba(77,255,122,.9), 0 14px 40px rgba(0,0,0,.45)}
  66%  {box-shadow:0 0 60px rgba(59,217,255,.9), 0 14px 40px rgba(0,0,0,.45)}
  83%  {box-shadow:0 0 60px rgba(166,75,255,.9), 0 14px 40px rgba(0,0,0,.45)}
  100% {box-shadow:0 0 60px rgba(255,59,59,.9),  0 14px 40px rgba(0,0,0,.45)}
}

.planet-progress{font-size:24px;color:rgba(190,215,255,.95);font-weight:800;letter-spacing:2px}
.planet-accuracy{font-size:22px;color:rgba(180,220,255,.9);font-weight:800;letter-spacing:2px}
.planet-badge{position:absolute;top:22px;right:26px;font-size:54px;z-index:2}
.planet-boss-wrap{position:absolute;bottom:8px;right:8px;display:flex;align-items:center;gap:10px;z-index:3;cursor:pointer;pointer-events:auto}
.planet-boss-wrap.locked{filter:grayscale(1);opacity:.45}
.planet-boss-stars{font-size:36px;white-space:nowrap;line-height:1;display:inline-block;position:relative}
.planet-boss{font-size:132px;opacity:.95;line-height:1;filter:drop-shadow(0 3px 14px rgba(239,68,68,.8));animation:bossPulse 2s ease-in-out infinite}
@keyframes bossPulse{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.18) rotate(-5deg)}}
.quiz-top{display:flex;align-items:center;gap:16px}
.progress-track{flex:1;height:26px;background:rgba(0,0,0,.55);border-radius:13px;overflow:hidden;border:2px solid rgba(255,255,255,.2)}
.progress-fill{height:100%;width:0;border-radius:13px;transition:width .5s cubic-bezier(.4,0,.2,1);background:linear-gradient(90deg,#4f8cff 0%,#a855f7 50%,#ec4899 100%)}
.combo-badge{background:linear-gradient(135deg,#fbbf24 0%,#ef4444 100%);border-radius:24px;padding:12px 24px;font-size:28px;font-weight:900;white-space:nowrap;min-width:80px;text-align:center;display:none;border:2.5px solid rgba(255,255,255,.45);text-shadow:0 2px 8px rgba(0,0,0,.5)}
.combo-badge.show{display:block}
.quiz-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;padding:14px 0}
.q-label{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(99,102,241,.55),rgba(168,85,247,.55));border:2.5px solid rgba(168,85,247,.75);color:#f5ebff;border-radius:20px;padding:10px 24px;font-size:20px;font-weight:900;letter-spacing:3px;margin:0 auto 12px;align-self:center;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.q-prompt{text-align:center;font-size:clamp(28px,6vw,44px);font-weight:900;line-height:1.5;padding:0 10px;text-shadow:0 4px 20px rgba(0,0,0,.7);letter-spacing:.5px}
.q-blank{display:inline-block;min-width:70px;border-bottom:4px solid #fbbf24;margin:0 8px;color:#fbbf24}
.q-passage{background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:2px solid rgba(255,255,255,.18);border-radius:26px;padding:28px 30px;font-size:clamp(19px,4vw,26px);line-height:1.85;color:rgba(240,245,255,.98);text-align:left;margin-bottom:14px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.options{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.opt{background:linear-gradient(160deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,.04) 100%);border:3px solid rgba(255,255,255,.22);border-radius:999px;padding:32px 20px;font-size:clamp(26px,5.5vw,36px);font-weight:900;color:#fff;font-family:inherit;cursor:pointer;transition:transform .15s,background .15s;min-height:110px;display:flex;align-items:center;justify-content:center;letter-spacing:.5px;word-break:break-word;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4);text-shadow:0 3px 10px rgba(0,0,0,.5)}
.opt:active{transform:scale(.94)}
.opt.correct{background:linear-gradient(160deg,rgba(34,197,94,.75) 0%,rgba(34,197,94,.35) 100%);border-color:#22c55e}
.opt.wrong{background:linear-gradient(160deg,rgba(239,68,68,.75) 0%,rgba(239,68,68,.35) 100%);border-color:#ef4444}
.opt:disabled{pointer-events:none}
.spell-area{display:flex;flex-direction:column;gap:28px;align-items:center}
.spell-slots{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;min-height:110px;padding:24px;background:linear-gradient(160deg,rgba(0,0,0,.5),rgba(0,0,0,.25));border-radius:32px;border:3px dashed rgba(168,85,247,.65)}
.slot{width:80px;height:96px;border-radius:22px;background:linear-gradient(160deg,rgba(99,102,241,.35),rgba(99,102,241,.12));border:3px solid rgba(99,102,241,.7);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:#c7d2fe;cursor:pointer;transition:transform .15s}
.slot:active{transform:scale(.88)}
.slot.filled{background:linear-gradient(160deg,rgba(99,102,241,.85),rgba(168,85,247,.65));border-color:#a855f7;color:#fff}
.letter-pool{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.letter{width:88px;height:96px;border-radius:24px;background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,.06));border:3px solid rgba(255,255,255,.3);color:#fff;font-size:40px;font-weight:900;font-family:inherit;cursor:pointer;transition:transform .15s,opacity .15s;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.4);text-shadow:0 3px 8px rgba(0,0,0,.5)}
.letter:active{transform:scale(.85)}
.letter.used{opacity:.1;pointer-events:none;transform:scale(.75)}
.order-area{display:flex;flex-direction:column;gap:26px;align-items:center}
.order-zone{min-height:150px;width:100%;background:linear-gradient(160deg,rgba(0,0,0,.5),rgba(0,0,0,.25));border-radius:32px;border:3px dashed rgba(99,102,241,.65);padding:24px;display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:center}
.order-word{background:linear-gradient(160deg,rgba(99,102,241,.65),rgba(168,85,247,.45));border:3px solid rgba(168,85,247,.85);border-radius:24px;padding:22px 32px;font-size:34px;font-weight:900;color:#fff;cursor:pointer;font-family:inherit;transition:transform .15s,opacity .15s;box-shadow:0 8px 22px rgba(99,102,241,.5);text-shadow:0 3px 8px rgba(0,0,0,.55)}
.order-word:active{transform:scale(.9)}
.word-pool{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.word-pool .order-word{background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,.06));border-color:rgba(255,255,255,.32);box-shadow:0 8px 20px rgba(0,0,0,.4)}
.word-pool .order-word.used{opacity:.1;pointer-events:none;transform:scale(.75)}
.listen-btn{width:220px;height:220px;border-radius:50%;background:linear-gradient(135deg,#4f8cff 0%,#a855f7 50%,#ec4899 100%);border:none;font-size:100px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin:0 auto;color:#fff;transition:transform .15s;position:relative;box-shadow:0 20px 60px rgba(168,85,247,.85),inset 0 6px 0 rgba(255,255,255,.55)}

/* ============ 庆祝效果 ============ */
function spawnCelebrateConfetti(duration, intensity){
  intensity = intensity || 1;
  var colors = ['#fbbf24','#f472b6','#a855f7','#60a5fa','#22c55e','#ef4444','#f59e0b','#ec4899','#f97316','#06b6d4','#84cc16'];
  var total = Math.floor(intensity * 90);
  var interval = intensity > 0.5 ? 35 : 85;
  for(var i=0;i<total;i++){
    (function(idx){
      setTimeout(function(){
        var c = document.createElement('div');
        c.className = 'celebrate-confetti';
        c.style.left = (Math.random()*100) + '%';
        c.style.background = colors[Math.floor(Math.random()*colors.length)];
        c.style.animationDuration = (2.4 + Math.random()*2.4) + 's';
        c.style.width = (8 + Math.random()*10) + 'px';
        c.style.height = (12 + Math.random()*12) + 'px';
        if(Math.random() < 0.5) c.style.borderRadius = '50%';
        document.body.appendChild(c);
        setTimeout(function(){ if(c.parentNode) c.parentNode.removeChild(c); }, 6000);
      }, idx * interval);
    })(i);
  }
}

function ensureUnlockedArray(){
  if(!save.unlockedPlanets || !(save.unlockedPlanets instanceof Array)) save.unlockedPlanets = [1];
  if(save.unlockedPlanets.indexOf(1) === -1) save.unlockedPlanets.unshift(1);
}
function isPlanetUnlocked(id){
  if(id === 1) return true;
  ensureUnlockedArray();
  return save.unlockedPlanets.indexOf(id) !== -1;
}
function unlockPlanet(id){
  ensureUnlockedArray();
  if(id >= 1 && id <= UNIT_DATA.length && save.unlockedPlanets.indexOf(id) === -1){
    save.unlockedPlanets.push(id);
  }
}
function unlockNextPlanet(fromId){
  if(fromId + 1 <= UNIT_DATA.length) unlockPlanet(fromId + 1);
}
function migrateUnlockedPlanets(){
  if(!save) return;
  if(!save.unlockedPlanets || !(save.unlockedPlanets instanceof Array)) save.unlockedPlanets = [1];
  if(save.unlockedPlanets.indexOf(1) === -1) save.unlockedPlanets.unshift(1);
  if(save.currentPlanet && save.unlockedPlanets.indexOf(save.currentPlanet) === -1){
    save.unlockedPlanets.push(save.currentPlanet);
  }
  if(save.cleared && save.cleared.length){
    for(var i=0;i<save.cleared.length;i++){
      var s = '' + save.cleared[i];
      var m = s.match(/^u(\d+)$/);
      if(m){
        var id = parseInt(m[1], 10);
        if(save.unlockedPlanets.indexOf(id) === -1) save.unlockedPlanets.push(id);
        if(id+1 <= UNIT_DATA.length && save.unlockedPlanets.indexOf(id+1) === -1) save.unlockedPlanets.push(id+1);
      }
    }
  }
  if(save.stars){
    for(var pid in save.stars){
      var mm = pid.match(/^u(\d+)$/);
      if(mm){
        var id2 = parseInt(mm[1], 10);
        if(save.unlockedPlanets.indexOf(id2) === -1) save.unlockedPlanets.push(id2);
        if(id2+1 <= UNIT_DATA.length && save.unlockedPlanets.indexOf(id2+1) === -1) save.unlockedPlanets.push(id2+1);
      }
    }
  }
  if(save.levelProgress){
    for(var lk in save.levelProgress){
      var lm = lk.match(/^u(\d+)_L/);
      if(lm){
        var id3 = parseInt(lm[1], 10);
        if(save.unlockedPlanets.indexOf(id3) === -1) save.unlockedPlanets.push(id3);
        if(id3+1 <= UNIT_DATA.length && save.unlockedPlanets.indexOf(id3+1) === -1) save.unlockedPlanets.push(id3+1);
      }
    }
  }
  if(!save.finalUnlocked){
    var allC = true;
    for(var k2=0;k2<UNIT_DATA.length;k2++){
      if(save.cleared.indexOf('u'+UNIT_DATA[k2].id) === -1){ allC = false; break; }
    }
    save.finalUnlocked = allC;
  }
}
function checkAllClearedForFinal(){
  var allC = true;
  for(var k2=0;k2<UNIT_DATA.length;k2++){
    if(save.cleared.indexOf('u'+UNIT_DATA[k2].id) === -1){ allC = false; break; }
  }
  if(allC) save.finalUnlocked = true;
}

var FUNCTION_WORDS = ['for','to','at','on','in','of','with','by','is','are','am','do','does',"don't","doesn't",'the','a','an'];
var AMBIGUOUS_WORDS = ['best','too','also','well','so','very','much','not','no','and','my','your','his','her','our','their','all'];
var ALL_VOCAB_WORDS = [];
var ALL_VOCAB_MEANS = [];
function collectAllVocab(){
  ALL_VOCAB_WORDS = []; ALL_VOCAB_MEANS = [];
  var seenEn = {}, seenZh = {};
  for(var i=0;i<UNIT_DATA.length;i++){
    var uid = UNIT_DATA[i].id;
    var v = UNIT_DATA[i].vocab;
    for(var j=0;j<v.length;j++){
      var en = capOpt(v[j][0]); var zh = v[j][1];
      if(!seenEn[en]){ seenEn[en] = true; ALL_VOCAB_WORDS.push({en:en,zh:zh,unitId:uid}); }
      if(!seenZh[zh]){ seenZh[zh] = true; ALL_VOCAB_MEANS.push({en:en,zh:zh,unitId:uid}); }
    }
  }
}
function pickWrongEn(correctEn, currentUnitId, n){
  n = n || 3;
  var sameUnit = [], otherUnit = [];
  for(var i=0;i<ALL_VOCAB_WORDS.length;i++){
    var it = ALL_VOCAB_WORDS[i];
    if(it.en.toLowerCase() === correctEn.toLowerCase()) continue;
    if(it.unitId === currentUnitId) sameUnit.push(it.en); else otherUnit.push(it.en);
  }
  sameUnit = shuffleArray(sameUnit); otherUnit = shuffleArray(otherUnit);
  var wrongs = [];
  for(var i=0;i<sameUnit.length && wrongs.length<2;i++){ if(wrongs.indexOf(sameUnit[i])===-1) wrongs.push(sameUnit[i]); }
  for(var i=0;i<otherUnit.length && wrongs.length<n;i++){ if(wrongs.indexOf(otherUnit[i])===-1) wrongs.push(otherUnit[i]); }
  if(wrongs.length < n){
    var all = shuffleArray(ALL_VOCAB_WORDS);
    for(var i=0;i<all.length && wrongs.length<n;i++){ if(all[i].en.toLowerCase()!==correctEn.toLowerCase() && wrongs.indexOf(all[i].en)===-1) wrongs.push(all[i].en); }
  }
  return wrongs.slice(0,n);
}
function pickWrongZh(correctZh, currentUnitId, n){

  var sameUnit = [], otherUnit = [];
  for(var i=0;i<ALL_VOCAB_MEANS.length;i++){
    var it = ALL_VOCAB_MEANS[i];

  for(var i=0;i<otherUnit.length && wrongs.length<n;i++){ if(wrongs.indexOf(otherUnit[i])===-1) wrongs.push(otherUnit[i]); }
  if(wrongs.length < n){
    var all = shuffleArray(ALL_VOCAB_MEANS);
    for(var i=0;i<all.length && wrongs.length<n;i++){ if(all[i].zh!==correctZh && wrongs.indexOf(all[i].zh)===-1) wrongs.push(all[i].zh); }

function buildUnitBank(unit){
  var bank = []; var seen = {};
  function push(q){
    if(!q._key) q._key = JSON.stringify({t:q.t,q:q.q,word:q.word,hint:q.hint,sentence:q.sentence,title:q.title});
    if(!seen[q._key]){ seen[q._key] = true; bank.push(q); }
  }
  var vocab = unit.vocab;
  var sentences = unit.sentences;
  var readings = unit.readings;
  for(var i=0;i<vocab.length;i++){
    var v = vocab[i]; var correctEn = capOpt(v[0]);
    var wrongs = pickWrongEn(correctEn, unit.id, 3);
    if(wrongs.length < 3) continue;
    var opts = shuffleArray([correctEn].concat(wrongs));
    push({t:'choice', q:'“'+v[1]+'”用英语怎么说？', o:opts, a:opts.indexOf(correctEn), e:v[0]+' '+v[1]});
  }
  for(var i=0;i<vocab.length;i++){
    var v = vocab[i];
    var wrongs = pickWrongZh(v[1], unit.id, 3);
    if(wrongs.length < 3) continue;
    var opts = shuffleArray([v[1]].concat(wrongs));
    push({t:'choice', q:'“'+v[0]+'”是什么意思？', o:opts, a:opts.indexOf(v[1]), e:v[0]+' '+v[1]});
  }
  for(var i=0;i<vocab.length;i++){
    var v = vocab[i]; var correctEn = capOpt(v[0]);
    var wrongs = pickWrongEn(correctEn, unit.id, 3);
    if(wrongs.length < 3) continue;
    var opts = shuffleArray([correctEn].concat(wrongs));
    push({t:'listen', word:v[0], q:'听一听，选出正确的单词', o:opts, a:opts.indexOf(correctEn), e:v[0]+' '+v[1]});
  }
  for(var i=0;i<vocab.length;i++){
    var v = vocab[i];
    if(v[0].length > 12) continue;
    push({t:'spell', hint:v[1], word:v[0], extra:'XYZ'});
  }
  for(var i=0;i<sentences.length;i++){
    var s = sentences[i];
    var words = s.en.replace(/[.,!?;:'"]/g,'').split(' ').filter(function(w){return w.length>0;});
    if(words.length < 3) continue;
    push({t:'order', hint:s.zh, words:words});
  }
  for(var i=0;i<sentences.length;i++){
    var s = sentences[i];
    var rawWords = s.en.toLowerCase().replace(/[.,!?;:'"]/g,'').split(' ').filter(function(w){return w.length>0;});
    var skip = false;
    for(var ai=0; ai<AMBIGUOUS_WORDS.length; ai++){ if(rawWords.indexOf(AMBIGUOUS_WORDS[ai]) !== -1){ skip = true; break; } }
    if(skip) continue;
    var funcIdxs = [];
    for(var wi=0; wi<rawWords.length; wi++){ if(FUNCTION_WORDS.indexOf(rawWords[wi]) !== -1) funcIdxs.push(wi); }
    if(funcIdxs.length === 0) continue;
    var blankIdx = funcIdxs[i % funcIdxs.length];
    var answer = rawWords[blankIdx];
    var blanked = rawWords.slice(); blanked[blankIdx] = '___';
    var wrongs = [];
    for(var fi=0; fi<FUNCTION_WORDS.length && wrongs.length<3; fi++){

    if(wrongs.length < 3) continue;
    var opts = shuffleArray([capOpt(answer)].concat(wrongs.slice(0,3)));
    push({t:'fill', q:blanked.join(' '), o:opts, a:opts.indexOf(capOpt(answer)), e:s.en+' '+s.zh});
  }
  for(var i=0;i<readings.length;i++){
    var r = readings[i];
    push({t:'read', title:r.title, text:r.text, q:r.q, o:r.o, a:r.a, e:r.e});
  }
  for(var i=0;i<sentences.length;i++){ push({t:'speak', sentence:sentences[i].en}); }
  return bank;
}

  for(var j=0;j<=a.length;j++) d[0][j] = j;
  for(var i2=1;i2<=b.length;i2++){ for(var j2=1;j2<=a.length;j2++){ d[i2][j2] = b.charAt(i2-1)===a.charAt(j2-1) ? d[i2-1][j2-1] : Math.min(d[i2-1][j2-1]+1, d[i2][j2-1]+1, d[i2-1][j2]+1); } }
  return d[b.length][a.length];
}

function flyCoinToBoss(){
  var av = $('boss-avatar'); if(!av) return;
  var rect = av.getBoundingClientRect();
  var endX = rect.left + rect.width/2; var endY = rect.top + rect.height/2;
  var startX = W/2; var startY = H*0.85;
  var coin = document.createElement('div');
  coin.style.cssText = 'position:fixed;width:80px;height:80px;border-radius:50%;pointer-events:none;z-index:60;' +
    'left:' + startX + 'px;top:' + startY + 'px;transform:translate(-50%,-50%);' +
    'background:radial-gradient(circle at 30% 30%,#fef3c7,#fbbf24 50%,#d97706 100%);' +
    'border:6px solid #92400e;box-shadow:0 0 30px #fbbf24;';
  document.body.appendChild(coin);
  var t0 = performance.now(); var dur = 620;
  function anim(t){
    var k = Math.min(1, (t - t0) / dur);
    var ease = k < 0.5 ? 2*k*k : -1+(4-2*k)*k;
    var x = startX + (endX - startX) * ease;
    var y = startY + (endY - startY) * ease - Math.sin(k*Math.PI) * 140;
    coin.style.left = x + 'px'; coin.style.top = y + 'px';
    var sc = 1 + Math.sin(k*Math.PI) * 1.1;
    coin.style.transform = 'translate(-50%,-50%) scale(' + sc + ') rotate(' + (k*1080) + 'deg)';
    if(k < 1) requestAnimationFrame(anim);
    else { sfxCoin(); explode(endX, endY, '#fbbf24', 20); coin.remove(); }
  }
  requestAnimationFrame(anim);

    safeText($('shop-coins'), save.coins);
    var body = $('shop-body'); if(!body) return;
    body.innerHTML = '';
    var sec = document.createElement('div');
    sec.className = 'shop-section';
    sec.innerHTML = '<h3>🛠️ 最终 BOSS 战斗道具</h3><p style="font-size:18px;color:rgba(190,210,255,.8);margin-bottom:18px;">这些道具在最终 BOSS 战中随时购买、立即生效。普通关卡和单元 BOSS 不需要道具。</p>';
    var grid = document.createElement('div'); grid.className = 'shop-grid';
    for(var si=0; si<BOSS_SHOP_ITEMS.length; si++){
      (function(it){
        var div = document.createElement('div'); div.className = 'shop-item';
        div.innerHTML = '<div class="icon">' + it.icon + '</div>' +
          '<div class="name">' + it.name + '</div>' +
          '<div class="price"><span class="coin-icon"></span> ' + it.price + '</div>' +
          '<div style="font-size:16px;color:rgba(190,210,255,.8);margin-top:6px;">' + (it.dmg ? ('扣 BOSS ' + it.dmg + ' 血') : ('时间 +' + it.time + ' 秒')) + '</div>';
        grid.appendChild(div);
      })(BOSS_SHOP_ITEMS[si]);
    }
    sec.appendChild(grid); body.appendChild(sec);
  }catch(e){ showFatalError('renderShop: ' + e.message); }
}
function bindEvents(){
  function bind(id, fn){ var el = $(id); if(el) el.onclick = fn; }
  bind('btn-start', function(){ initAudio(); unlockSpeech(); sfxClick(); showScreen('s-map'); renderMap(); });
  bind('btn-continue-game', function(){ initAudio(); unlockSpeech(); sfxClick(); resumeGame(); });
  bind('btn-home', function(){ sfxClick(); cancelSpeech(); renderHome(); showScreen('s-home'); });
  bind('btn-shop', function(){ sfxClick(); renderShop(); showScreen('s-shop'); });
  bind('btn-shop-back', function(){ sfxClick(); renderHome(); showScreen('s-home'); });
  bind('btn-reset', function(){
    sfxClick();
    showModal('重置进度？','所有星星、金币、徽章都会清空，且无法恢复。', function(){
      showModal('真的要重置吗？','这是最后确认，重置后无法撤销。', function(){
        try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
        document.cookie = COOKIE_KEY + '=;max-age=0;path=/';
        save = defaultSave(); checkDaily(); persist();
        renderHome(); showToast('进度已重置');
      }, '确认重置', '我再想想', true);
    }, '重置', '取消', true);
  });
  bind('btn-quit', function(){
    sfxClick();
    cancelSpeech();
    showModal('退出关卡？','当前进度会保存。', function(){
      stopTimer(); persist(); renderHome(); showScreen('s-home');
    }, '退出', '继续', true);
  });
  bind('btn-boss-quit', function(){
    sfxClick();
    cancelSpeech();
    showModal('退出 BOSS 战？','本关进度不会保留。', function(){
      stopBossTimer(); persist(); renderHome(); showScreen('s-home');
    }, '退出', '继续', true);
  });
  bind('btn-boss-shop-toggle', function(){ sfxClick(); var shop = $('boss-shop'); if(!shop) return; G.bossShopOpen = !G.bossShopOpen; shop.classList.toggle('show', G.bossShopOpen); if(G.bossShopOpen) renderBossShop(); });
  bind('btn-continue', function(){
    sfxClick();
    var needCongrats = G.showCongratsAfterContinue;
    G.showCongratsAfterContinue = false;
    if(G.isFinal || (G.unit && G.levelIdx === -1)){ 
      showScreen('s-map'); renderMap(); 
      if(needCongrats){ setTimeout(function(){ showSingleModal('🎉 恭喜满分！', '恭喜你本次测试达到满分！', null, '确认'); }, 1000); }
      return; 
    }
    var u = G.unit; var uIdx = 0;
    for(var k=0;k<UNIT_DATA.length;k++){ if(UNIT_DATA[k].id === u.id) uIdx = k; }
    var nextLv = G.levelIdx + 1;
    if(u && nextLv < 3){ startUnit(u, nextLv, uIdx); }
    else if(u && nextLv === 3){
      if(isBossUnlocked(u)) startBoss(u, uIdx);
      else { 
        showScreen('s-map'); renderMap(); 
        if(needCongrats){ setTimeout(function(){ showSingleModal('🎉 恭喜满分！', '恭喜你本次测试达到满分！', null, '确认'); }, 1000); }
      }
    }
    else { 
      showScreen('s-map'); renderMap(); 
      if(needCongrats){ setTimeout(function(){ showSingleModal('🎉 恭喜满分！', '恭喜你本次测试达到满分！', null, '确认'); }, 1000); }
    }
  });
}
function init(){
  try{
    bgCanvas = $('bgCanvas'); fxCanvas = $('fxCanvas');
    if(bgCanvas) bgCtx = bgCanvas.getContext('2d');
    if(fxCanvas) fxCtx = fxCanvas.getContext('2d');
    resizeAll(); loadSave(); buildAllBanks(); renderHome(); showScreen('s-home'); bindEvents();
    window.addEventListener('resize', resizeAll);
    window.addEventListener('orientationchange', function(){ setTimeout(resizeAll, 300); });
    var unlockAll = function(){ initAudio(); if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); unlockSpeech(); document.removeEventListener('touchstart', unlockAll); document.removeEventListener('mousedown', unlockAll); document.removeEventListener('click', unlockAll); };
    document.addEventListener('touchstart', unlockAll, {passive:true});
    document.addEventListener('mousedown', unlockAll);
    document.addEventListener('click', unlockAll);
    document.addEventListener('visibilitychange', persist);
    window.addEventListener('pagehide', persist);
    window.addEventListener('beforeunload', persist);
    bgLoop(); fxLoop();
    setInterval(persist, 5000);
  }catch(e){ showFatalError('init: ' + e.message + '\n' + (e.stack||'')); }
}
if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', init); }
else { init(); }
</script>
